---
# 2 Services
# 2.1.1 Ensure autofs services are not in use
# autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives.
# With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents available in the filesystem even if they lacked permissions to mount it themselves.
- name: 2.1.1 Ensure autofs services are not in use
  block:
    - name: 2.1.1 Ensure autofs services are not in use - sysctl
      service:
        name: autofs
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.1 Ensure autofs services are not in use - apt
      apt:
        name: autofs
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.1
    - scored
  when: debian12cis_rules_2_1_1
# 2.1.2 Ensure avahi daemon services are not in use
# Avahi is a free zeroconf implementation, including a system for multicast DNS/DNS-SD
# service discovery. Avahi allows programs to publish and discover services and hosts
# running on a local network with no specific configuration. For example, a user can plug a
# computer into a network and Avahi automatically finds printers to print to, files to look at
# and people to talk to, as well as network services running on the machine.
# Automatic discovery of network services is not normally required for system functionality. It is recommended to remove this package to reduce the potential attack surface.
- name: 2.1.2 Ensure avahi daemon services are not in use
  vars:
    avahi_daemon_services:
      - avahi-daemon.socket
      - avahi-daemon.service
  block:
    - name: 2.1.2 Ensure avahi daemon services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: avahi_daemon_services
    - name: 2.1.2 Ensure avahi daemon services are not in use - apt
      apt:
        name: avahi-daemon
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.2
    - scored
  when: debian12cis_rules_2_1_2
# 2.1.3 Ensure dhcp server services are not in use
# The Dynamic Host Configuration Protocol (DHCP) is a service that allows machines to be dynamically assigned IP addresses. There are two versions of the DHCP protocol DHCPv4 and DHCPv6. At startup the server may be started for one or the other via the -4 or -6 arguments.
# Unless a system is specifically set up to act as a DHCP server, it is recommended that this package be removed to reduce the potential attack surface.
- name: 2.1.3 Ensure dhcp server services are not in use
  vars:
    dhcp_server_services:
      - isc-dhcp-server.service
      - isc-dhcp-server6.service
  block:
    - name: 2.1.3 Ensure dhcp server services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: dhcp_server_services
    - name: 2.1.3 Ensure dhcp server services are not in use - apt
      apt:
        name: isc-dhcp-server
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.3
    - scored
  when: debian12cis_rules_2_1_3
# 2.1.4 Ensure dns server services are not in use
# The Domain Name System (DNS) is a hierarchical naming system that maps names to IP
# addresses for computers, services and other resources connected to a network.
# Unless a system is specifically designated to act as a DNS server, it is recommended that the package be deleted to reduce the potential attack surface.
- name: 2.1.4 Ensure dns server services are not in use
  block:
    - name: 2.1.4 Ensure dns server services are not in use - sysctl
      service:
        name: bind9.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.4 Ensure dns server services are not in use - apt
      apt:
        name: bind9
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.4
    - scored
  when: debian12cis_rules_2_1_4
# 2.1.5 Ensure dnsmasq services are not in use
# dnsmasq is a lightweight tool that provides DNS caching, DNS forwarding and DHCP (Dynamic Host Configuration Protocol) services.
# Unless a system is specifically designated to act as a DNS caching, DNS forwarding and/or DHCP server, it is recommended that the package be removed to reduce the potential attack surface.
- name: 2.1.5 Ensure dnsmasq services are not in use
  block:
    - name: 2.1.5 Ensure dnsmasq services are not in use - sysctl
      service:
        name: dnsmasq.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.5 Ensure dnsmasq services are not in use - apt
      apt:
        name: dnsmasq
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.5
    - scored
  when: debian12cis_rules_2_1_5
# 2.1.6 Ensure ftp server services are not in use
# The File Transfer Protocol (FTP) provides networked computers with the ability to transfer files.
# FTP does not protect the confidentiality of data or authentication credentials. It is recommended SFTP be used if file transfer is required. Unless there is a need to run the system as a FTP server (for example, to allow anonymous downloads), it is recommended that the package be deleted to reduce the potential attack surface.
- name: 2.1.6 Ensure ftp server services are not in use
  block:
    - name: 2.1.6 Ensure ftp server services are not in use - sysctl
      service:
        name: vsftpd.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.6 Ensure ftp server services are not in use - apt
      apt:
        name: vsftpd
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.6
    - scored
  when: debian12cis_rules_2_1_6
# 2.1.7 Ensure ldap server services are not in use
# The Lightweight Directory Access Protocol (LDAP) was introduced as a replacement for NIS/YP. It is a service that provides a method for looking up information from a central database.
# If the system will not need to act as an LDAP server, it is recommended that the software be removed to reduce the potential attack surface.
- name: 2.1.7 Ensure ldap server services are not in use
  block:
    - name: 2.1.7 Ensure ldap server services are not in use - sysctl
      service:
        name: slapd.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.7 Ensure ldap server services are not in use - apt
      apt:
        name: slapd
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.7
    - scored
  when: debian12cis_rules_2_1_7
# 2.1.8 Ensure message access server services are not in use
# dovecot-imapd and dovecot-pop3d are an open source IMAP and POP3 server for Linux based systems.
# Unless POP3 and/or IMAP servers are to be provided by this system, it is recommended that the package be removed to reduce the potential attack surface.
- name: 2.1.8 Ensure message access server services are not in use
  vars:
    message_access_server_services:
      - dovecot.socket
      - dovecot.service
    message_access_server_libraries:
      - dovecot-imapd
      - dovecot-pop3d
  block:
    - name: 2.1.8 Ensure message access server services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: message_access_server_services
    - name: 2.1.8 Ensure message access server services are not in use - apt
      apt:
        name: "{{ item }}"
        state: absent
        purge: true
        autoremove: true
      loop: message_access_server_libraries
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.8
    - scored
  when: debian12cis_rules_2_1_8
# 2.1.9 Ensure network file system services are not in use
# The Network File System (NFS) is one of the first and most widely distributed file systems in the UNIX environment. It provides the ability for systems to mount file systems of other servers through the network.
# If the system does not export NFS shares, it is recommended that the nfs-kernel-server package be removed to reduce the remote attack surface.
- name: 2.1.9 Ensure network file system services are not in use
  block:
    - name: 2.1.9 Ensure network file system services are not in use - sysctl
      service:
        name: nfs-server.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.9 Ensure network file system services are not in use - apt
      apt:
        name: nfs-kernel-server
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.9
    - scored
  when: debian12cis_rules_2_1_9
# 2.1.10 Ensure nis server services are not in use
# The Network Information Service (NIS) (formally known as Yellow Pages) is a client-server directory service protocol for distributing system configuration files. The NIS server is a collection of programs that allow for the distribution of configuration files. The NIS client ( ypbind ) was used to bind a machine to an NIS server and receive the distributed configuration files.
# ypserv.service is inherently an insecure system that has been vulnerable to DOS attacks, buffer overflows and has poor authentication for querying NIS maps. NIS generally has been replaced by such protocols as Lightweight Directory Access Protocol (LDAP). It is recommended that ypserv.service be removed and other, more secure services be used
- name: 2.1.10 Ensure nis server services are not in use
  block:
    - name: 2.1.10 Ensure nis server services are not in use - sysctl
      service:
        name: ypserv.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.10 Ensure nis server services are not in use - apt
      apt:
        name: ypserv
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.10
    - scored
  when: debian12cis_rules_2_1_10
# 2.1.11 Ensure print server services are not in use
# The Common Unix Print System (CUPS) provides the ability to print to both local and network printers. A system running CUPS can also accept print jobs from remote systems and print them to local printers. It also provides a web based remote administration capability.
# If the system does not need to print jobs or accept print jobs from other systems, it is recommended that CUPS be removed to reduce the potential attack surface.
- name: 2.1.11 Ensure print server services are not in use
  vars:
   print_server_services:
    - cups.socket
    - cups.service
  block:
    - name: 2.1.11 Ensure print server services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: print_server_services
    - name: 2.1.11 Ensure print server services are not in use - apt
      apt:
        name: cups
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.11
    - scored
  when: debian12cis_rules_2_1_11
# 2.1.12 Ensure rpcbind services are not in use
# The rpcbind utility maps RPC services to the ports on which they listen. RPC processes notify rpcbind when they start, registering the ports they are listening on and the RPC program numbers they expect to serve. The client system then contacts rpcbind on the server with a particular RPC program number. The rpcbind.service redirects the client to the proper port number so it can communicate with the requested service.
# A small request (~82 bytes via UDP) sent to the Portmapper generates a large response (7x to 28x amplification), which makes it a suitable tool for DDoS attacks. If rpcbind is not required, it is recommended to remove rpcbind package to reduce the potential attack surface.
- name: 2.1.12 Ensure rpcbind services are not in use
  vars:
   rpcbind_services:
    - rpcbind.socket
    - rpcbind.service
  block:
    - name: 2.1.12 Ensure rpcbind services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: rpcbind_services
    - name: 2.1.12 Ensure rpcbind services are not in use - apt
      apt:
        name: rpcbind
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.12
    - scored
  when: debian12cis_rules_2_1_12
# 2.1.13 Ensure rsync services are not in use
# The rsync service can be used to synchronize files between systems over network links.
# rsync.service presents a security risk as the rsync protocol is unencrypted. The rsync package should be removed to reduce the attack area of the system.
- name: 2.1.13 Ensure rsync services are not in use
  block:
    - name: 2.1.13 Ensure rsync services are not in use - sysctl
      service:
        name: rsync.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.13 Ensure rsync services are not in use - apt
      apt:
        name: rsync
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.13
    - scored
  when: debian12cis_rules_2_1_13
# 2.1.14 Ensure Samba is not enabled
# The Samba daemon allows system administrators to configure their Linux systems to share
# file systems and directories with Windows desktops. Samba will advertise the file systems
# and directories via the Server Message Block (SMB) protocol. Windows desktop users will
# be able to mount these directories and file systems as letter drives on their systems.
- name: 2.1.14 Ensure Samba is not enabled
  block:
    - name: 2.1.14 Ensure Samba is not enabled - sysctl
      service:
        name: smbd.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.14 Ensure Samba is not enabled - apt
      apt:
        name: samba
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.14
    - scored
  when: debian12cis_rules_2_1_14
# 2.1.15 Ensure SNMP Server is not enabled
# Simple Network Management Protocol (SNMP) is a widely used protocol for monitoring the
# health and welfare of network equipment, computer equipment and devices like UPSs.
# Net-SNMP is a suite of applications used to implement SNMPv1 (RFC 1157), SNMPv2 (RFCs
# 1901-1908), and SNMPv3 (RFCs 3411-3418) using both IPv4 and IPv6.
# Support for SNMPv2 classic (a.k.a. "SNMPv2 historic" - RFCs 1441-1452) was dropped with
# the 4.0 release of the UCD-snmp package.
# The Simple Network Management Protocol (SNMP) server is used to listen for SNMP
# commands from an SNMP management system, execute the commands or collect the
# information and then send results back to the requesting system.
- name: 2.1.15 Ensure SNMP Server is not enabled
  block:
    - name: 2.1.15 Ensure SNMP Server is not enabled - sysctl
      service:
        name: snmpd.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.15 Ensure SNMP Server is not enabled - apt
      apt:
        name: snmpd
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.15
    - scored
  when: debian12cis_rules_2_1_15
# 2.1.16 Ensure tftp server services are not in use
# Trivial File Transfer Protocol (TFTP) is a simple protocol for exchanging files between two TCP/IP machines. TFTP servers allow connections from a TFTP Client for sending and receiving files.
# Unless there is a need to run the system as a TFTP server, it is recommended that the package be removed to reduce the potential attack surface.
# TFTP does not have built-in encryption, access control or authentication. This makes it very easy for an attacker to exploit TFTP to gain access to files.
- name: 2.1.16 Ensure tftp server services are not in use
  block:
    - name: 2.1.16 Ensure tftp server services are not in use - sysctl
      service:
        name: tftpd-hpa.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.16 Ensure tftp server services are not in use - apt
      apt:
        name: tftpd-hpa
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.16
    - scored
  when: debian12cis_rules_2_1_16
# 2.1.17 Ensure web proxy server services are not in use
# Squid is a standard proxy server used in many distributions and environments.
# Unless a system is specifically set up to act as a proxy server, it is recommended that the squid package be removed to reduce the potential attack surface.
- name: 2.1.17 Ensure web proxy server services are not in use
  block:
    - name: 2.1.17 Ensure web proxy server services are not in use - sysctl
      service:
        name: squid.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.17 Ensure web proxy server services are not in use - apt
      apt:
        name: squid
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.17
    - scored
  when: debian12cis_rules_2_1_17
# 2.1.18 Ensure web server services are not in use
# Web servers provide the ability to host web site content.
# Unless there is a local site approved requirement to run a web server service on the system, web server packages should be removed to reduce the potential attack surface.
- name: 2.1.18 Ensure web server services are not in use
  vars:
    web_server_services:
      - apache2.socket
      - httpd.service
      - nginx.service
    web_server_libraries:
      - apache2
      - nginx
  block:
    - name: 2.1.18 Ensure web server services are not in use - sysctl
      service:
        name: "{{ item }}"
        state: stopped
        enabled : no
      ignore_errors: true
      loop: web_server_services
    - name: 2.1.18 Ensure web server services are not in use - apt
      apt:
        name: "{{ item }}"
        state: absent
        purge: true
        autoremove: true
      loop: web_server_libraries
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.18
    - scored
  when: debian12cis_rules_2_1_18
# 2.1.19 Ensure xinetd services are not in use
# Web servers provide the ability to host web site content.
# Unless there is a local site approved requirement to run a web server service on the system, web server packages should be removed to reduce the potential attack surface.
- name: 2.1.19 Ensure xinetd services are not in use
  block:
    - name: 2.1.19 Ensure xinetd services are not in use - sysctl
      service:
        name: xinetd.service
        state: stopped
        enabled : no
      ignore_errors: true
    - name: 2.1.19 Ensure xinetd services are not in use - apt
      apt:
        name: xinetd
        state: absent
        purge: true
        autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.1.19
    - scored
  when: debian12cis_rules_2_1_19
# 2.1.20 Ensure X window server services are not in use
# The X Window System provides a Graphical User Interface (GUI) where users can have multiple windows in which to run programs and various add on. The X Windows system is typically used on workstations where users login, but not on servers where users typically do not login.
# Unless your organization specifically requires graphical login access via X Windows, remove it to reduce the potential attack surface.
- name: 2.1.20 Ensure X window server services are not in use
  apt:
    name: xserver-common
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - 2.1.20
    - scored
  when: debian12cis_rules_2_1_20
# 2.1.21 Ensure mail transfer agent is configured for local-only mode
# Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming mail and transfer the messages to the appropriate user or mail server. If the system is not intended to be a mail server, it is recommended that the MTA be configured to only process local mail.
# The software for all Mail Transfer Agents is complex and most have a long history of security issues. While it is important to ensure that the system can process local mail messages, it is not necessary to have the MTA's daemon listening on a port unless the server is intended to be a mail server that receives and processes mail from other systems.
- name: 2.1.21 Ensure mail transfer agent is configured for local-only mode
  blockinfile:
    path: /etc/postfix/main.cf
    insertafter: ".*RECEIVING MAIL.*"
    block: |
      inet_interfaces = loopback-only
  notify: restart postfix
  tags:
    - section2
    - level_1_server
    - 2.1.21
    - scored
  when: debian12cis_rules_2_1_21
# 2.1.22 Ensure systemd-timesyncd configured with authorized timeserver
# Time synchronization is important to support time sensitive security mechanisms and to ensure log files have consistent time records across the enterprise to aid in forensic investigations
- name: 2.1.22 Ensure systemd-timesyncd configured with authorized timeserver
  debug:
    msg: To be implemented
  tags:
    - section2
    - level_1_server
    - 2.1.22
    - scored
  when: debian12cis_rules_2_1_22
# 2.2.1 Ensure NIS client is not installed
# The Network Information Service (NIS), formerly known as Yellow Pages, is a client-server directory service protocol used to distribute system configuration files. The NIS client was used to bind a machine to an NIS server and receive the distributed configuration files.
# The NIS service is inherently an insecure system that has been vulnerable to DOS attacks, buffer overflows and has poor authentication for querying NIS maps. NIS generally has been replaced by such protocols as Lightweight Directory Access Protocol (LDAP). It is recommended that the service be removed.
- name: 2.2.1 Ensure NIS client is not installed
  apt:
    name: nis
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.1
    - scored
  when: debian12cis_rules_2_2_1
# 2.2.2 Ensure rsh client is not installed
# The rsh-client package contains the client commands for the rsh services.
# These legacy clients contain numerous security exposures and have been replaced with the more secure SSH package. Even if the server is removed, it is best to ensure the clients are also removed to prevent users from inadvertently attempting to use these commands and therefore exposing their credentials. Note that removing the rsh-client package removes the clients for rsh , rcp and rlogin .
- name: 2.2.2 Ensure rsh client is not installed
  apt:
    name: rsh-client
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.2
    - scored
  when: debian12cis_rules_2_2_2
# 2.2.3 Ensure talk client is not installed
# The talk software makes it possible for users to send and receive messages across systems through a terminal session. The talk client, which allows initialization of talk sessions, is installed by default.
# The software presents a security risk as it uses unencrypted protocols for communication.
- name: 2.2.3 Ensure talk client is not installed
  apt:
    name: talk
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.3
    - scored
  when: debian12cis_rules_2_2_3
# 2.2.4 Ensure telnet client is not installed
# The telnet package contains the telnet client, which allows users to start connections to other systems via the telnet protocol.
# The telnet protocol is insecure and unencrypted. The use of an unencrypted transmission medium could allow an unauthorized user to steal credentials. The ssh package provides an encrypted session and stronger security and is included in most Linux distributions.
- name: 2.2.4 Ensure telnet client is not installed
  apt:
    name: telnet
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.4
    - scored
  when: debian12cis_rules_2_2_4
# 2.2.5 Ensure LDAP client is not installed
# The Lightweight Directory Access Protocol (LDAP) was introduced as a replacement for
# NIS/YP. It is a service that provides a method for looking up information from a central database.
# Removing the LDAP client will prevent or inhibit using LDAP for authentication in your
# environment.
# If the system will not need to act as an LDAP client, it is recommended that the software be removed to reduce the potential attack surface.
- name: 2.2.5 Ensure LDAP client is not installed
  apt:
    name: ldap-utils
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.5
    - scored
  when: debian12cis_rules_2_2_5
# 2.2.6 Ensure ftp client is not installed
# FTP (File Transfer Protocol) is a traditional and widely used standard tool for transferring files between a server and clients over a network, especially where no authentication is necessary (permits anonymous users to connect to a server).
# FTP does not protect the confidentiality of data or authentication credentials. It is recommended SFTP be used if file transfer is required. Unless there is a need to run the system as a FTP server (for example, to allow anonymous downloads), it is recommended that the package be removed to reduce the potential attack surface.
- name: 2.2.6 Ensure ftp client is not installed
  apt:
    name: ftp
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.6
    - scored
  when: debian12cis_rules_2_2_6
# 2.2.10 Ensure HTTP server is not enabled
# HTTP or web servers provide the ability to host web site content.
# Note: Several httpd servers exist and can use other service names. apache2 and nginx are
# example services that provide an HTTP server. These and other services should also be audited
- name: 2.2.10 Ensure HTTP server is not enabled
  block:
  - name: 2.2.10 Ensure HTTP server is not enabled - apache
    service:
      name: apache2
      state: stopped
      enabled : no
    ignore_errors: true
  - name: 2.2.10 Ensure HTTP server is not enabled - nginx
    service:
      name: nginx
      state: stopped
      enabled : no
    ignore_errors: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.10
    - scored
  when: debian12cis_rules_2_2_10
# 2.2.15 Ensure mail transfer agent is configured for local-only mode
# Mail Transfer Agents (MTA), such as sendmail and Postfix, are used to listen for incoming
# mail and transfer the messages to the appropriate user or mail server. If the system is not
# intended to be a mail server, it is recommended that the MTA be configured to only process
# local mail.
- name: 2.2.15 Ensure mail transfer agent is configured for local-only mode
  block:
    - name: 2.2.15 Ensure mail transfer agent is configured for local-only mode
      stat:
        path: /etc/postfix/main.cf
      register: output_2_2_15
    - name: 2.2.15 Ensure mail transfer agent is configured for local-only mode
      lineinfile:
        dest: /etc/postfix/main.cf
        regexp: "^(#)?inet_interfaces"
        line: "inet_interfaces = localhost"
      when: output_2_2_15.stat.exists
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.2.15
    - scored
  when: debian12cis_rules_2_2_15
# 2.3.1.1 Ensure a single time synchronization daemon is in use
# System time should be synchronized between all systems in an environment. This is typically done by establishing an authoritative time server or set of servers and having all systems synchronize their clocks to them.
# Time synchronization is important to support time sensitive security mechanisms and ensures log files have consistent time records across the enterprise, which aids in forensic investigations.
- name: 2.3.1.1 Ensure a single time synchronization daemon is in use
  apt:
    name: chrony
    state: absent
    purge: true
    autoremove: true
  tags:
    - section2
    - level_1_server
    - level_1_workstation
    - 2.3.1.1
    - scored
  when: debian12cis_rules_2_3_1_1