---
# 3 Network Configuration
# 3.1 Configure Network Devices
# 3.1.1 Ensure IPv6 status is identified
# If IPv6 or dual stack is not to be used, it is recommended that IPv6 be disabled to reduce the attack surface of the system.
- name: 3.1.1 Ensure IPv6 status is identified
  replace:
    dest: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=(?!.*ipv6.disable)\"[^\"]*)(\".*)'
    replace: '\1 ipv6.disable=1\2'
  notify:
    - grub restart
  tags:
    - section3
    - level_2_server
    - level_2_workstation
    - 3.1.1
    - not-scored
  when: debian12cis_rules_3_1_1
# 3.1.2 Ensure wireless interfaces are disabled
# Wireless networking is used when wired networks are unavailable. Debian contains a
# wireless tool kit to allow system administrators to configure and use wireless networks
- name: 3.1.2 Ensure wireless interfaces are disabled
  block:
    - name: 3.1.2 Ensure wireless interfaces are disabled - verify
      script: 3_1_2.sh
      changed_when: output_3_1_2 is search("is enabled")
      register: output_3_1_2
    - name: 3.1.2 Ensure wireless interfaces are disabled - print output
      debug:
        msg: "{{ output_3_1_2 }}"
    - name: 3.1.2 Ensure wireless interfaces are disabled - fix
      script: 3_1_2_disable.sh
      when: output_3_1_2 is search("is enabled")
  tags:
    - section3
    - level_1_server
    - level_2_workstation
    - 3.1.2
    - scored
  when: debian12cis_rules_3_1_2
# 3.1.3 Ensure bluetooth services are not in use
# Bluetooth is a short-range wireless technology standard that is used for exchanging data between devices over short distances. It employs UHF radio waves in the ISM bands, from 2.402 GHz to 2.48 GHz. It is mainly used as an alternative to wire connections.
# An attacker may be able to find a way to access or corrupt your data.
# One example of this type of activity is bluesnarfing, which refers to attackers using a Bluetooth connection to steal information off of your Bluetooth device.
# Also, viruses or other malicious code can take advantage of Bluetooth technology to infect other devices. If you are infected, your data may be corrupted, compromised, stolen, or lost.
- name: 3.1.3 Ensure bluetooth services are not in use
  block:
  - name: 3.1.3 Ensure bluetooth services are not in use - apache
    service:
      name: bluetooth.service
      state: stopped
      enabled : no
    ignore_errors: true
  - name: 3.1.3 Ensure bluetooth services are not in use - nginx
    service:
      name: bluez
      state: stopped
      enabled : no
    ignore_errors: true
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.1.3
    - scored
  when: debian12cis_rules_3_1_3
# 3.2 Configure Network Kernel Modules
# 3.2.1 Ensure dccp kernel module is not available
# If the protocol is not required, it is recommended that the drivers not be installed to reduce
# the potential attack surface.
- name: 3.2.1 Ensure dccp kernel module is not available
  block:
    - name: Create blacklist configuration for dccp
      copy:
        dest: /etc/modprobe.d/blacklist-dccp.conf
        content: |
          # Disable dccp module
          blacklist dccp
          install dccp /bin/true
        owner: root
        group: root
        mode: '0644'
    - name: Ensure the dccp module is not loaded
      command: rmmod dccp
      ignore_errors: true
    - name: Update the initramfs to apply the blacklist
      command: update-initramfs -u
  tags:
    - section3
    - level_2_server
    - level_2_workstation
    - 3.2.1
    - scored
  when: debian12cis_rules_3_2_1
# 3.2.2 Ensure tipc kernel module is not available
# The Transparent Inter-Process Communication (TIPC) protocol is designed to provide
# communication between cluster nodes.
- name: 3.2.2 Ensure tipc kernel module is not available
  block:
    - name: Create blacklist configuration for tipc
      copy:
        dest: /etc/modprobe.d/blacklist-tipc.conf
        content: |
          # Disable tipc module
          blacklist tipc
          install tipc /bin/true
        owner: root
        group: root
        mode: '0644'
    - name: Ensure the tipc module is not loaded
      command: rmmod tipc
      ignore_errors: true
    - name: Update the initramfs to apply the blacklist
      command: update-initramfs -u
  tags:
    - section3
    - level_2_server
    - level_2_workstation
    - 3.2.2
    - scored
  when: debian12cis_rules_3_2_2
# 3.2.3 Ensure rds kernel module is not available
# The Reliable Datagram Sockets (RDS) protocol is a transport layer protocol designed to provide low-latency, high-bandwidth communications between cluster nodes. It was developed by the Oracle Corporation.
# If the protocol is not being used, it is recommended that kernel module not be loaded, disabling the service to reduce the potential attack surface.
- name: 3.2.3 Ensure rds kernel module is not available
  block:
    - name: Create blacklist configuration for tipc
      copy:
        dest: /etc/modprobe.d/blacklist-rds.conf
        content: |
          # Disable rds module
          blacklist rds
          install rds /bin/true
        owner: root
        group: root
        mode: '0644'
    - name: Ensure the rds module is not loaded
      command: rmmod rds
      ignore_errors: true
    - name: Update the initramfs to apply the blacklist
      command: update-initramfs -u
  tags:
    - section3
    - level_2_server
    - level_2_workstation
    - 3.2.3
    - scored
  when: debian12cis_rules_3_2_3
# 3.2.4 Ensure sctp kernel module is not available
# The Stream Control Transmission Protocol (SCTP) is a transport layer protocol used to support message oriented communication, with several streams of messages in one connection. It serves a similar function as TCP and UDP, incorporating features of both. It is message-oriented like UDP, and ensures reliable in-sequence transport of messages with congestion control like TCP.
# If  the protocol is not being used, it is recommended that kernel module not be loaded, disabling the service to reduce the potential attack surface.
- name: 3.2.4 Ensure sctp kernel module is not available
  block:
    - name: Create blacklist configuration for sctp
      copy:
        dest: /etc/modprobe.d/blacklist-sctp.conf
        content: |
          # Disable sctp module
          blacklist sctp
          install sctp /bin/true
        owner: root
        group: root
        mode: '0644'
    - name: Ensure the sctp module is not loaded
      command: rmmod sctp
      ignore_errors: true
    - name: Update the initramfs to apply the blacklist
      command: update-initramfs -u
  tags:
    - section3
    - level_2_server
    - level_2_workstation
    - 3.2.4
    - scored
  when: debian12cis_rules_3_2_4
# 3.3.1 Ensure ip forwarding is disabled
# Setting the flags to 0 ensures that a system with multiple interfaces (for example, a hard proxy), will never be able to forward packets, and therefore, never serve as a router.
- name: 3.3.1 Ensure ip forwarding is disabled
  block:
    - name: 3.3.1 Ensure IP forwarding is disabled - ipv4
      sysctl:
        name: net.ipv4.ip_forward
        value: "0"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        state: present
        reload: true
      notify:
        - ipv4 flush route
    - name: 3.3.1 Ensure IP forwarding is disabled - ipv4 fix
      shell: grep -Els "^\s*net\.ipv4\.ip_forward\s*=\s*1" /etc/sysctl.conf /etc/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /run/sysctl.d/*.conf | while read filename; do sed -ri "s/^\s*(net\.ipv4\.ip_forward\s*)(=)(\s*\S+\b).*$/#*REMOVED* \1/" $filename; echo $filename ; done
      register: output_3_3_1
      changed_when: output_3_3_1.stdout_lines | length > 0
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.1
    - scored
  when: debian12cis_rules_3_3_1
# 3.3.2 Ensure packet redirect sending is disabled
# ICMP Redirects are used to send routing information to other hosts. As a host itself does
# not act as a router (in a host only configuration), there is no need to send redirects.
- name: 3.3.2 Ensure packet redirect sending is disabled
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    sysctl_set: true
    state: present
    reload: true
  with_items:
    - {
        name: net.ipv4.conf.all.send_redirects,
        value: 0
      }
    - {
        name: net.ipv4.conf.default.send_redirects,
        value: 0
      }
  notify:
    - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.2
    - scored
  when: debian12cis_rules_3_3_2
# 3.3.3 Ensure bogus ICMP responses are ignored
# Some routers (and some attackers) will send responses that violate RFC-1122 and attempt
# to fill up a log file system with many useless error messages.
- name: 3.3.3 Ensure bogus ICMP responses are ignored
  sysctl:
    name: net.ipv4.icmp_ignore_bogus_error_responses
    value: "1"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    state: present
    reload:
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.3
    - scored
  when: enable_firewall and
        firewall_type == "nftables" and
        debian12cis_rules_3_3_3
# 3.3.4 Ensure broadcast icmp requests are ignored
# Accepting ICMP echo and timestamp requests with broadcast or multicast destinations for
# your network could be used to trick your host into starting (or participating) in a Smurf
# attack. A Smurf attack relies on an attacker sending large amounts of ICMP broadcast
# messages with a spoofed source address. All hosts receiving this message and responding
# would send echo-reply messages back to the spoofed address, which is probably not
# routable. If many hosts respond to the packets, the amount of traffic on the network could
# be significantly multiplied.
- name: 3.3.4 Ensure broadcast icmp requests are ignored
  block:
    - name: 3.3.4 Ensure broadcast icmp requests are ignored - ipv4
      sysctl:
        name: net.ipv4.icmp_echo_ignore_broadcasts
        value: "1"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        state: present
        reload: true
      notify:
        - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.4
    - scored
  when: debian12cis_rules_3_3_4
# 3.3.5 Ensure icmp redirects are not accepted
# Attackers could use bogus ICMP redirect messages to maliciously alter the system routing
# tables and get them to send packets to incorrect networks and allow your system packets
# to be captured.
- name: 3.3.5 Ensure icmp redirects are not accepted
  block:
    - name: 3.3.5 Ensure icmp redirects are not accepted - ipv4
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
      with_items:
        - { name: net.ipv4.conf.all.accept_redirects, value: 0 }
        - { name: net.ipv4.conf.default.accept_redirects, value: 0 }
      notify:
        - ipv4 flush route
    - name: 3.3.5 Ensure icmp redirects are not accepted - ipv6
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
      with_items:
        - { name: net.ipv6.conf.all.accept_redirects, value: 0 }
        - { name: net.ipv6.conf.default.accept_redirects, value: 0 }
      notify:
        - ipv6 flush route
      when:
        - IPv6_is_enabled
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.5
    - scored
  when: debian12cis_rules_3_3_5
# 3.3.6 Ensure secure ICMP redirects are not accepted
# It is still possible for even known gateways to be compromised. Setting
# net.ipv4.conf.all.secure_redirects to 0 protects the system from routing table
# updates by possibly compromised known gateways.
- name: 3.3.6 Ensure secure ICMP redirects are not accepted
  block:
    - name: 3.3.6 Ensure secure ICMP redirects are not accepted - ipv4
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
        ignoreerrors: true
      with_items:
        - { name: net.ipv4.conf.all.secure_redirects, value: 0 }
        - { name: net.ipv4.conf.default.secure_redirects, value: 0 }
      notify:
        - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.6
    - scored
  when: debian12cis_rules_3_3_6
# 3.3.7 Ensure Reverse Path Filtering is enabled
# Setting these flags is a good way to deter attackers from sending your system bogus
# packets that cannot be responded to. One instance where this feature breaks down is if
# asymmetrical routing is employed. This would occur when using dynamic routing protocols
# (bgp, ospf, etc) on your system. If you are using asymmetrical routing on your system, you
# will not be able to enable this feature without breaking the routing.
- name: 3.3.7 Ensure Reverse Path Filtering is enabled
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    sysctl_set: true
    state: present
    reload: true
  with_items:
    - { name: net.ipv4.conf.all.rp_filter, value: 1 }
    - { name: net.ipv4.conf.default.rp_filter, value: 1 }
  notify:
        - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.7
    - scored
  when: debian12cis_rules_3_3_7
# 3.3.8 Ensure source routed packets are not accepted
# Setting net.ipv4.conf.all.accept_source_route,
# net.ipv4.conf.default.accept_source_route,
# net.ipv6.conf.all.accept_source_route and
# net.ipv6.conf.default.accept_source_route to 0 disables the system from accepting
# source routed packets. Assume this system was capable of routing packets to Internet
# routable addresses on one interface and private addresses on another interface. Assume
# that the private addresses were not routable to the Internet routable addresses and vice
# versa. Under normal routing circumstances, an attacker from the Internet routable
# addresses could not use the system as a way to reach the private address systems. If,
# however, source routed packets were allowed, they could be used to gain access to the
# private address systems as the route could be specified, rather than rely on routing
# protocols that did not allow this routing.
- name: 3.3.8 Ensure source routed packets are not accepted
  block:
    - name: 3.3.8 Ensure source routed packets are not accepted - ipv4
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
      with_items:
        - { name: net.ipv4.conf.all.accept_source_route, value: 0 }
        - { name: net.ipv4.conf.default.accept_source_route, value: 0 }
      notify:
        - ipv4 flush route
    - name: 3.3.8 Ensure source routed packets are not accepted - ipv6
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
      with_items:
        - { name: net.ipv6.conf.all.accept_source_route, value: 0 }
        - { name: net.ipv6.conf.default.accept_source_route, value: 0 }
      notify:
        - ipv6 flush route
      when:
        - IPv6_is_enabled
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.8
    - scored
  when: debian12cis_rules_3_3_8
# 3.3.9 Ensure suspicious packets are logged
# Enabling this feature and logging these packets allows an administrator to investigate the
# possibility that an attacker is sending spoofed packets to their system.
- name: 3.3.9 Ensure suspicious packets are logged
  block:
    - name: 3.3.9 Ensure suspicious packets are logged - ipv4
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        sysctl_set: true
        state: present
        reload: true
      with_items:
        - { name: net.ipv4.conf.all.log_martians, value: 1 }
        - { name: net.ipv4.conf.default.log_martians, value: 1 }
      notify:
        - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.9
    - scored
  when: debian12cis_rules_3_3_9
# 3.3.10 Ensure tcp syn cookies is enabled
# Attackers use SYN flood attacks to perform a denial of service attacked on a system by
# sending many SYN packets without completing the three way handshake. This will quickly
# use up slots in the kernel's half-open connection queue and prevent legitimate connections
# from succeeding. SYN cookies allow the system to keep accepting valid connections, even if
# under a denial of service attack.
- name: 3.3.10 Ensure tcp syn cookies is enabled
  sysctl:
    name: net.ipv4.tcp_syncookies
    value: "1"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    state: present
    reload: true
  notify:
    - ipv4 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.10
    - scored
  when: debian12cis_rules_3_3_10
# 3.3.11 Ensure ipv6 router advertisements are not accepted
# It is recommended that systems do not accept router advertisements as they could be
# tricked into routing traffic to compromised machines. Setting hard routes within the
# system (usually a single default route to a trusted router) protects the system from bad
# routes.
- name: 3.3.11 Ensure ipv6 router advertisements are not accepted
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    state: present
    reload: true
  with_items:
    - { name: net.ipv6.conf.all.accept_ra, value: 0 }
    - { name: net.ipv6.conf.default.accept_ra, value: 0 }
  notify:
    - ipv6 flush route
  tags:
    - section3
    - level_1_server
    - level_1_workstation
    - 3.3.11
    - scored
  when: IPv6_is_enabled and
        debian12cis_rules_3_3_11