---
# 1.1.1.1 Ensure cramfs kernel module is not available
# The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
# A cramfs image can be used without having to first decompress the image.
- name: 1.1.1.1 Ensure cramfs kernel module is not available
  block:
    - name: 1.1.1.1 Ensure cramfs kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install cramfs"
        line: "install cramfs /bin/true"
        state: present
        create: true
    - name: 1.1.1.1 Ensure cramfs kernel module is not available - modprobe
      modprobe:
        name: cramfs
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.1
    - filesystems
    - cramfs
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_1
# 1.1.1.2 Ensure freevxfs kernel module is not available
# The freevxfs filesystem type is a free version of the Veritas type filesystem. This is the
# primary filesystem type for HP-UX operating systems.
- name: 1.1.1.2 Ensure freevxfs kernel module is not available
  block:
    - name: 1.1.1.2 Ensure freevxfs kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install freevxfs"
        line: "install freevxfs /bin/true"
        state: present
        create: true
    - name: 1.1.1.2 Ensure freevxfs kernel module is not available - modprobe
      modprobe:
        name: freevxfs
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.2
    - filesystems
    - freevxfs
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_2
# 1.1.1.3 Ensure hfs kernel module is not available
# The hfs filesystem type is a hierarchical filesystem that allows you to mount Mac OS filesystems.
- name: 1.1.1.3 Ensure hfs kernel module is not available
  block:
    - name: 1.1.1.3 Ensure hfs kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install hfs"
        line: "install hfs /bin/true"
        state: present
        create: true
    - name: 1.1.1.3 Ensure hfs kernel module is not available - modprobe
      modprobe:
        name: hfs
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.3
    - filesystems
    - hfs
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_3
# 1.1.1.4 Ensure hfsplus kernel module is not available
# The hfsplus filesystem type is a hierarchical filesystem designed to replace hfs that allows you to mount Mac OS filesystems.
- name: 1.1.1.4 Ensure hfsplus kernel module is not available
  block:
    - name: 1.1.1.4 Ensure hfsplus kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install hfsplus"
        line: "install hfsplus /bin/true"
        state: present
        create: true
    - name: 1.1.1.4 Ensure hfsplus kernel module is not available - modprobe
      modprobe:
        name: hfsplus
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.4
    - filesystems
    - hfsplus
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_4
# 1.1.1.2.1.4 Ensure jffs2 kernel module is not available
# The jffs2 (journaling flash filesystem 2) filesystem type is a log-structured filesystem used
# in flash memory devices.
- name: 1.1.1.2.1.4 Ensure jffs2 kernel module is not available
  block:
    - name: 1.1.1.Ensure jffs2 kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install jffs2(\\s|$)"
        line: "install jffs2 /bin/true"
        state: present
        create: true
    - name: 1.1.1.Ensure jffs2 kernel module is not available - modprobe
      modprobe:
        name: jffs2
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.5
    - filesystems
    - jffs2
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_2_1_4
# 1.1.1.6 Ensure mounting of squashfs filesystems is disabled
# The squashfs filesystem type is a compressed read-only Linux filesystem embedded in
# small footprint systems (similar to cramfs ). A squashfs image can be used without having
# to first decompress the image.
- name: 1.1.1.6 Ensure mounting of squashfs filesystems is disabled
  block:
    - name: 1.1.1.6 Ensure mounting of squashfs filesystems is disabled
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install squashfs(\\s|$)"
        line: "install squashfs /bin/true"
        state: present
        create: true
    - name: 1.1.1.6 Ensure mounting of squashfs filesystems is disabled - modprobe
      modprobe:
        name: squashfs
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.6
    - filesystems
    - squashfs
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_6
# 1.1.1.7 Ensure mounting of udf filesystems is disabled
# The udf filesystem type is the universal disk format used to implement ISO/IEC 13346 and
# ECMA-167 specifications. This is an open vendor filesystem type for data storage on a
# broad range of media. This filesystem type is necessary to support writing DVDs and newer
# optical disc formats.
- name: 1.1.1.7 Ensure mounting of udf filesystems is disabled
  block:
    - name: 1.1.1.7 Ensure mounting of udf filesystems is disabled
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install udf(\\s|$)"
        line: "install udf /bin/true"
        state: present
        create: true
    - name: 1.1.1.7 Ensure mounting of udf filesystems is disabled - modprobe
      modprobe:
        name: udf
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.7
    - filesystems
    - udf
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_7
# 1.1.1.8 Ensure usb-storage kernel module is not available
# USB storage provides a means to transfer and store files ensuring persistence and availability of the files independent of network connection status. Its popularity and utility has led to USB-based malware being a simple and common means for network infiltration and a first step to establishing a persistent threat within a networked environment.
- name: 1.1.1.8 Ensure usb-storage kernel module is not available
  block:
    - name: 1.1.1.8 Ensure usb-storage kernel module is not available
      lineinfile:
        dest: /etc/modprobe.d/CIS.conf
        regexp: "^(#)?install usb-storage(\\s|$)"
        line: "install usb-storage /bin/true"
        state: present
        create: true
    - name: 1.1.1.8 Ensure usb-storage kernel module is not available - modprobe
      modprobe:
        name: usb-storage
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.1.8
    - filesystems
    - usb-storage
    - modprobe
    - scored
  when: debian12cis_rules_1_1_1_8
# 1.1.2.1.1 Ensure /tmp is a separate partition
# The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
- name: 1.1.2.1.1 Ensure /tmp is a separate partition
  assert:
    that: ansible_mounts | byattr('mount', '/tmp') | list | length > 0
    fail_msg: "/tmp is NOT a separate partition"
    success_msg: "/tmp is a separate partition"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.1.1
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_2_1
# 1.1.2.1.2 Ensure nodev option set on /tmp partition
- name: 1.1.2.1.2 Ensure nodev option set on /tmp partition
  block:
    - name: 1.1.2.1.2 Ensure nodev option set on /tmp partition - get info
      shell: |
        mount | grep -E '\s/tmp\s' | grep -v nodev 2>/dev/null
      ignore_errors: true
      register: output_1_1_2_1_2
      changed_when: output_1_1_2_1_2.stdout_lines | length > 0
      check_mode: no
    - name: 1.1.2.1.2 Ensure nodev option set on /tmp partition - get fstab opts
      shell: |
        mount | grep -E '\s/tmp\s' | sed 's/.*(\(.*\)).*/\1/' 2>/dev/null
      register: output_1_1_2_1_2_opts
      changed_when: false
      check_mode: no
    - name: 1.1.2.1.2 Ensure nodev option set on /tmp partition - show fstab opts
      debug:
        msg: "{{ output_1_1_2_1_2_opts.stdout | trim }}"
    - name: 1.1.2.1.2 Ensure nodev option set on /tmp partition - fix
      mount:
        path: /tmp
        src: "{{ item.device }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ output_1_1_2_1_2_opts.stdout }},nodev"
        state: present
      with_items: "{{ ansible_mounts | byattr('mount', '/tmp') | list }}"
      when: output_1_1_2_1_2.stdout_lines | length > 0
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.1.2
    - tmp
    - mount
    - scored
  when: debian12cis_rules_1_1_2_1_2
# 1.1.2.1.3 Ensure nosuid option set on /tmp partition
- name: 1.1.2.1.3 Ensure nosuid option set on /tmp partition
