        path: /tmp
        src: "{{ item.device }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ output_1_1_2_1_4_opts.stdout }},noexec"
        state: present
      with_items: "{{ ansible_mounts | byattr('mount', '/tmp') | list }}"
      when: output_1_1_2_1_4.stdout_lines | length > 0
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.5
    - tmp
    - mount
    - scored
  when: debian12cis_rules_1_1_2_1_4
# 1.1.2.2.1 Ensure /dev/shm is a separate partition
# The /dev/shm directory is a world-writable directory that can function as shared memory that facilitates inter process communication (IPC).
- name: 1.1.2.2.1 Ensure /dev/shm is a separate partition
  assert:
    that: ansible_mounts | byattr('mount', '/dev/shm') | list | length > 0
    fail_msg: "/dev/shm is NOT a separate partition"
    success_msg: "/dev/shm is a separate partition"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.1
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_2_1
# 1.1.2.2.2 Ensure nodev option set on /dev/shm partition
# The nodev mount option specifies that the filesystem cannot contain special devices.
# Since the user partitions are not intended to support devices, set this option to ensure that
# users cannot attempt to create block or character special devices.
- import_tasks: all_mounts_facts.yaml
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.2
    - scored
  when: debian12cis_rules_1_1_2_2_2
- name: 1.1.2.2.2 Ensure nodev option set on /dev/shm partition
  mount:
    name: "{{ item.mount }}"
    state: mounted
    fstype: "{{ item.fstype }}"
    src: "{{ item.device }}"
    opts: "{{ item.options.split(',') | union(['nodev']) | join(',') }}"
  with_items: "{{ all_mounts.stdout | default('{}') | from_json | byattr('mount', '/dev/shm') | list }}"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.2
    - scored
  when: debian12cis_rules_1_1_2_2_2
# 1.1.2.2.3 Ensure nosuid option set on /dev/shm partition
# The nosuid mount option specifies that the filesystem cannot contain setuid files.
# Setting this option on a file system prevents users from introducing privileged programs
# onto the system and allowing non-root users to execute them.
- import_tasks: all_mounts_facts.yaml
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.3
    - scored
  when: debian12cis_rules_1_1_2_2_3
- name: 1.1.2.2.3 Ensure nosuid option set on /dev/shm partition
  mount:
    name: "{{ item.mount }}"
    state: mounted
    fstype: "{{ item.fstype }}"
    src: "{{ item.device }}"
    opts: "{{ item.options.split(',') | union(['nosuid']) | join(',') }}"
  with_items: "{{ all_mounts.stdout | default('{}') | from_json | byattr('mount', '/dev/shm') | list }}"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.3
    - scored
  when: debian12cis_rules_1_1_2_2_3
# 1.1.2.2.4 Ensure noexec option set on /dev/shm partition
# The noexec mount option specifies that the filesystem cannot contain executable binaries.
# Setting this option on a file system prevents users from executing programs from shared
# memory. This deters users from introducing potentially malicious software on the system.
- import_tasks: all_mounts_facts.yaml
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.4
    - scored
  when: debian12cis_rules_1_1_2_2_4
- name: 1.1.2.2.4 Ensure noexec option set on /dev/shm partition
  mount:
    name: "{{ item.mount }}"
    state: mounted
    fstype: "{{ item.fstype }}"
    src: "{{ item.device }}"
    opts: "{{ item.options.split(',') | union(['noexec']) | join(',') }}"
  with_items: "{{ all_mounts.stdout | default('{}') | from_json | byattr('mount', '/dev/shm') | list }}"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.2.4
    - scored
  when: debian12cis_rules_1_1_2_2_4
# 1.1.2.3.1 Ensure separate partition exists for /home
# If the system is intended to support local users, create a separate partition for the /home
# directory to protect against resource exhaustion and restrict the type of files that can be
# stored under /home.
- name: 1.1.2.3.1 Ensure separate partition exists for /home
  assert:
    that: ansible_mounts | byattr('mount', '/home') | list | length > 0
    fail_msg: "/home is NOT a separate partition"
    success_msg: "/home is a separate partition"
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.1.2.3.1
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_3_1
# 1.1.2.3.2 Ensure nodev option set on /home partition
# The nodev mount option specifies that the filesystem cannot contain special devices.
# Since the /home filesystem is not intended to support devices, set this option to ensure that users cannot create a block or character special devices in /home.
- name: 1.1.2.3.2 Ensure nodev option set on /home partition
  mount:
    path: /home
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: defaults,nodev
    state: present
  with_items: "{{ ansible_mounts | byattr('mount', '/home') | list }}"
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.1.2.3.2
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_3_2
# 1.1.2.3.3 Ensure nosuid option set on /home partition
# The nosuid mount option specifies that the filesystem cannot contain setuid files.
# Since the /home filesystem is only intended for user file storage, set this option to ensure that users cannot create setuid files in /home.
- name: 1.1.2.3.3 Ensure nosuid option set on /home partition
  mount:
    path: /home
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: defaults,nosuid
    state: present
  with_items: "{{ ansible_mounts | byattr('mount', '/home') | list }}"
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.1.2.3.3
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_3_3
# 1.1.2.4.1 Ensure separate partition exists for /var
# The /var directory is used by daemons and other system services to temporarily store
# dynamic data. Some directories created by these processes may be world-writable.
# Note: When modifying /var it is advisable to bring the system to emergency mode (so auditd is
# not running), rename the existing directory, mount the new file system, and migrate the
# data over before returning to multiuser mode.
- name: 1.1.2.4.1 Ensure separate partition exists for /var
  assert:
    that: ansible_mounts | byattr('mount', '/var') | list | length > 0
    fail_msg: "/var is NOT a separate partition"
    success_msg: "/var is a separate partition"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.4.1
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_4_1
# 1.1.2.4.2 Ensure nodev option set on /var partition
# The nodev mount option specifies that the filesystem cannot contain special devices.
# Since the /var filesystem is not intended to support devices, set this option to ensure that users cannot create a block or character special devices in /home.
- name: 1.1.2.4.2 Ensure nodev option set on /home partition
  mount:
    path: /var
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: defaults,nodev
    state: present
  with_items: "{{ ansible_mounts | byattr('mount', '/var') | list }}"
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.1.2.4.2
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_4_2
# 1.1.2.4.3 Ensure nosuid option set on /var partition
# The nosuid mount option specifies that the filesystem cannot contain setuid files.
# Since the /var filesystem is only intended for variable files such as logs, set this option to ensure that users cannot create setuid files in /var.
- name: 1.1.2.4.3 Ensure nosuid option set on /var partition
  mount:
    path: /var
    src: "{{ item.device }}"
    fstype: "{{ item.fstype }}"
    opts: defaults,nosuid
    state: present
  with_items: "{{ ansible_mounts | byattr('mount', '/var') | list }}"
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.1.2.4.3
    - manual_setup
    - scored
  when: debian12cis_rules_1_1_2_4_3
