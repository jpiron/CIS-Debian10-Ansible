# 1.1.2.5.3 Ensure nosuid option set on /var/tmp partition
- name: 1.1.2.5.3 Ensure nosuid option set on /var/tmp partition
  block:
    - name: 1.1.2.5.3 Ensure nosuid option set on /var/tmp partition - get info
      shell: |
        mount | grep -E '\s/var/tmp\s' | grep -v nosuid 2>/dev/null
