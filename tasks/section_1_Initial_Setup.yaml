        state: present
      with_items: "{{ ansible_mounts | byattr('mount', '/tmp') | list }}"
      when: output_1_1_2_1_3.stdout_lines | length > 0
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.1.2.1.3
    - tmp
    - mount
    - scored
  when: debian12cis_rules_1_1_2_1_3
# 1.1.2.1.4 Ensure noexec option set on /tmp partition
- name: 1.1.2.1.4 Ensure noexec option set on /tmp partition
  block:
    - name: 1.1.2.1.4 Ensure noexec option set on /tmp partition - get info
      shell: |
