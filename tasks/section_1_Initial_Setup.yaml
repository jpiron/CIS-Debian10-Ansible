# 1.3.1.1 Ensure AppArmor is installed
# AppArmor provides Mandatory Access Controls.
- name: 1.3.1.1 Ensure AppArmor is installed
  apt:
    name: ["apparmor", "apparmor-utils"]
    state: present
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.3.1.1
    - scored
  when: debian12cis_rules_1_3_1_1
# 1.3.1.3 Ensure all AppArmor Profiles are in enforce or complain mode
# AppArmor profiles define what resources applications are able to access.
- name: 1.3.1.3 Ensure all AppArmor Profiles are in enforce or complain mode,
    1.3.1.4 Ensure all AppArmor Profiles are enforcing
  shell: |
    find /etc/apparmor.d -maxdepth 1 -type f | while read file
    do
      if grep --quiet "flags\s*=.*complain" "$file"; then
        aa-enforce "$file"
      fi
    done
  tags:
    - section1
    - level_2_server
    - level_2_workstation
    - 1.3.1.3
    - 1.3.1.4
    - scored
