# 1.5.1 Ensure address space layout randomization is enabled
# Address space layout randomization (ASLR) is an exploit mitigation technique which randomly arranges the address space of key data areas of a process.
# Randomly placing virtual memory regions will make it difficult to write memory page exploits as the memory placement will be consistently shifting.
- name: 1.5.1 Ensure address space layout randomization is enabled
  sysctl:
    name: kernel.randomize_va_space
    value: "2"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    state: present
    reload: true
    sysctl_set: true
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.5.1
    - manual_setup
    - scored
  when: debian12cis_rules_1_5_1
# 1.5.2 Ensure ptrace_scope is restricted
# The ptrace() system call provides a means by which one process (the "tracer") may observe and control the execution of another process (the "tracee"), and examine and change the tracee's memory and registers.
# If one application is compromised, it would be possible for an attacker to attach to other running processes (e.g. Bash, Firefox, SSH sessions, GPG agent, etc) to extract additional credentials and continue to expand the scope of their attack.
# Enabling restricted mode will limit the ability of a compromised process to PTRACE_ATTACH on other processes running under the same user. With restricted mode, ptrace will continue to work with root user.
- name: 1.5.2 Ensure ptrace_scope is restricted
  sysctl:
    name: kernel.yama.ptrace_scope
    value: "1"
    sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
    state: present
    reload: true
    sysctl_set: true
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.5.2
    - manual_setup
    - scored
  when: debian12cis_rules_1_5_2
# 1.5.3 Ensure core dumps are restricted
# A core dump is the memory of an executable program. It is generally used to determine
# why a program aborted. It can also be used to glean confidential information from a core
# file. The system provides the ability to set a soft limit for core dumps, but this can be
# overridden by the user.
- name: 1.5.3 Ensure core dumps are restricted
  block:
    - name: 1.5.3 Ensure core dumps are restricted - sysctl
      sysctl:
        name: fs.suid_dumpable
        value: "0"
        sysctl_file: /etc/sysctl.d/CIS-sysctl.conf
        state: present
        reload: true
        sysctl_set: true
    - name: 1.5.3 Ensure core dumps are restricted - limits
      lineinfile:
        dest: /etc/security/limits.d/CIS-limits.conf
        line: "*                hard    core            0"
        regexp: '(^#)?\*\s+hard\s+core\s+[0-9]+'
        state: present
        create: true
    - name: 1.5.3 Ensure core dumps are restricted - apt
      apt:
        name: systemd-coredump
        state: present
    - name: 1.5.3 Ensure core dumps are restricted - reload
      systemd:
        daemon_reload: yes
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.5.3
    - scored
  when: debian12cis_rules_1_5_3
# 1.5.4 Ensure prelink is disabled
- name: 1.5.4 Ensure prelink is disabled
  block:
    - name: 1.5.4 Ensure prelink is disabled - restore
      command: prelink -ua
      ignore_errors: true
    - name: 1.5.4 Ensure prelink is disabled - apt purge
      apt:
        name: prelink
        state: absent
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.5.4
    - scored
  when: debian12cis_rules_1_5_4
# 1.6.1 Ensure message of the day is configured properly
# The contents of the /etc/motd file are displayed to users after login and function as a
# message of the day for authenticated users.
# Unix-based systems have typically displayed information about the OS release and patch
# level upon logging in to the system. This information can be useful to developers who are
# developing software for a particular OS platform. If mingetty(8) supports the following
# options, they display operating system information: \m - machine architecture \r -
# operating system release \s - operating system name \v - operating system version
- name: 1.6.1 Ensure message of the day is configured properly
  template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "u-x,go-wx"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.1
    - scored
  when: debian12cis_rules_1_6_1
# 1.6.2 Ensure local login warning banner is configured properly
- name: 1.6.2 Ensure local login warning banner is configured properly
  template:
    src: issue.net.j2
    dest: /etc/issue
    owner: root
    group: root
    mode: "u-x,go-wx"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.2
    - scored
  when: debian12cis_rules_1_6_2
# 1.6.3 Ensure remote login warning banner is configured properly
- name: 1.6.3 Ensure remote login warning banner is configured properly
  template:
    src: issue.net.j2
    dest: /etc/issue.net
    owner: root
    group: root
    mode: "u-x,go-wx"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.3
    - scored
  when: debian12cis_rules_1_6_3
# 1.6.4 Ensure access to /etc/motd is configured
# The contents of the /etc/motd file are displayed to users after login and function as a message of the day for authenticated users.
# If the /etc/motd file does not have the correct access configured, it could be modified by unauthorized users with incorrect or misleading information.
- name: 1.6.4 Ensure access to /etc/motd is configured
  file:
    path: /etc/motd
    owner: root
    group: root
    mode: '0644'
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.4
    - scored
  when: debian12cis_rules_1_6_4
# 1.6.5 Ensure access to /etc/issue is configured
# The contents of the /etc/issue file are displayed to users prior to login for local terminals.
# If the /etc/issue file does not have the correct access configured, it could be modified by unauthorized users with incorrect or misleading information.
- name: 1.6.5 Ensure access to /etc/issue is configured
  file:
    path: /etc/issue
    owner: root
    group: root
    mode: '0644'
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.5
    - scored
  when: debian12cis_rules_1_6_5
# 1.6.6 Ensure access to /etc/issue.net is configured
# The contents of the /etc/issue.net file are displayed to users prior to login for remote connections from configured services.
# If the /etc/issue.net file does not have the correct access configured, it could be modified by unauthorized users with incorrect or misleading information.
- name: 1.6.6 Ensure access to /etc/issue.net is configured
  file:
    path: /etc/issue.net
    owner: root
    group: root
    mode: '0644'
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.6.6
    - scored
  when: debian12cis_rules_1_6_6
# 1.7.1 Ensure GDM is removed
# The GNOME Display Manager (GDM) is a program that manages graphical display servers and handles graphical user logins.
# If a Graphical User Interface (GUI) is not required, it should be removed to reduce the attack surface of the system.
- name: 1.7.1 Ensure GDM is removed
  apt:
    name: gdm3
    state: absent
    purge: true
    autoremove: true
  become: true
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.7.1
    - scored
  when: debian12cis_rules_1_7_1
# 1.7.2 Ensure GDM login banner is configured
# GDM is the GNOME Display Manager which handles graphical login for GNOME based systems.
# Warning messages inform users who are attempting to login to the system of their legal status regarding the system and must include the name of the organization that owns the system and any monitoring policies that are in place.
- name: 1.7.2 Ensure GDM login banner is configured
  debug:
    msg: |
      If GDM is installed on the system verify that /etc/gdm3/greeter.dconf-defaults file
      exists and contains the following:
      [org/gnome/login-screen]
      banner-message-enable=true
      banner-message-text='Authorized uses only. All activity may be monitored and reported.'
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.7.2
    - manual_setup
    - scored
  when: debian12cis_rules_1_7_2
# 1.7.10 Ensure XDCMP is not enabled
# X Display Manager Control Protocol (XDMCP) is designed to provide authenticated access to display management services for remote displays.
# XDMCP is inherently insecure.
- name: 1.7.10 Ensure XDCMP is not enabled
  block:
    - name: Ensure XDMCP is not enabled in all relevant configuration files
      find:
        paths: "/etc"
        patterns: "*.conf"
        recurse: yes
      register: conf_files
    - name: Disable XDMCP by commenting out or removing "Enable=true" in [xdmcp] blocks
      blockinfile:
        path: "{{ item }}"
        block: |
          [xdmcp]
          # Enable=false
        state: present
      when: "'[xdmcp]' in item"
  tags:
    - section1
    - level_1_server
    - level_1_workstation
    - 1.7.10
    - scored
  when: debian12cis_rules_1_7_10
