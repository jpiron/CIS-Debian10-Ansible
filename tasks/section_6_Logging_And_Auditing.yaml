---
# 6.1.1 Ensure AIDE is installed
# AIDE takes a snapshot of filesystem state including modification times, permissions, and
# file hashes which can then be used to compare against the current state of the filesystem to
# detect modifications to the system.
- name: 6.1.1 Ensure AIDE is installed
  block:
    - name: 6.1.1 Ensure AIDE is installed
      apt:
        name: ["nullmailer", "aide-common", "aide"]
        state: present
        install_recommends: false
    - name: 6.1.1 Configure AIDE as appropriate for your environment - aideinit
      command: aideinit
    - name: 6.1.1 Configure AIDE as appropriate for your environment - aideinit db
      shell: |
        mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.1
    - scored
  when: debian12cis_rules_6_1_1
- name: 6.1.1 Audit system file permissions
  block:
    - name: 6.1.1 Audit system file permissions
      script: 6_1_1.sh
      register: output_6_1_1
    - name: 6.1.1 Audit system file permissions - print output
      debug:
        msg: "{{ output_6_1_1 }}"
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - manual_setup
    - 6.1.1
    - not-scored
  when: debian12cis_rules_6_1_1
# 6.1.2 Ensure filesystem integrity is regularly checked
# Periodic checking of the filesystem integrity is needed to detect changes to the filesystem.
# Periodic file checking allows the system administrator to determine on a regular basis if critical files have been changed in an unauthorized fashion.
- name: 6.1.2 Ensure filesystem integrity is regularly checked
  block:
    - name: Unmask dailyaidecheck.timer and dailyaidecheck.service
      systemd:
        name: "{{ item }}"
        state: unmasked
      loop:
        - dailyaidecheck.timer
        - dailyaidecheck.service

    - name: Enable and start dailyaidecheck.timer
      systemd:
        name: dailyaidecheck.timer
        enabled: yes
        state: started
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.2
    - scored
  when: debian12cis_rules_6_1_2
# 6.1.2 Ensure permissions on /etc/passwd are configured
# The /etc/passwd file contains user account information that is used by many system
# utilities and therefore must be readable for these utilities to operate.
- name: 6.1.2 Ensure permissions on /etc/passwd are configured
  file:
    dest: /etc/passwd
    owner: root
    group: root
    mode: 0644
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.2
    - scored
  when: debian12cis_rules_6_1_2
# 6.1.3 Ensure permissions on /etc/gshadow- are configured
# It is critical to ensure that the /etc/gshadow- file is protected from unauthorized access.
# Although it is protected by default, the file permissions could be changed either
# inadvertently or through malicious actions.
- name: 6.1.3 Ensure permissions on /etc/gshadow- are configured
  file:
    dest: /etc/gshadow-
    owner: root
    group: shadow
    mode: 0640
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.3
    - scored
  when: debian12cis_rules_6_1_3
# 6.1.4 Ensure permissions on /etc/shadow are configured
# If attackers can gain read access to the /etc/shadow file, they can easily run a password
# cracking program against the hashed password to break it. Other security information that
# is stored in the /etc/shadow file (such as expiration) could also be useful to subvert the
# user accounts.
- name: 6.1.4 Ensure permissions on /etc/shadow are configured
  file:
    dest: /etc/shadow
    owner: root
    group: shadow
    mode: 0640
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.4
    - scored
  when: debian12cis_rules_6_1_4
# 6.1.5 Ensure permissions on /etc/group are configured
# The /etc/group file needs to be protected from unauthorized changes by non-privileged
# users, but needs to be readable as this information is used with many non-privileged
# programs.
- name: 6.1.5 Ensure permissions on /etc/group are configured
  file:
    dest: /etc/group
    owner: root
    group: root
    mode: 0644
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.5
    - scored
  when: debian12cis_rules_6_1_5
# 6.1.6 Ensure permissions on /etc/passwd- are configured
# It is critical to ensure that the /etc/passwd- file is protected from unauthorized access.
# Although it is protected by default, the file permissions could be changed either
# inadvertently or through malicious actions.
- name: 6.1.6 Ensure permissions on /etc/passwd- are configured
  file:
    dest: /etc/passwd-
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.6
    - scored
  when: debian12cis_rules_6_1_6
# 6.1.7 Ensure permissions on /etc/shadow- are configured
# It is critical to ensure that the /etc/shadow- file is protected from unauthorized access.
# Although it is protected by default, the file permissions could be changed either
# inadvertently or through malicious actions.
- name: 6.1.7 Ensure permissions on /etc/shadow- are configured
  file:
    dest: /etc/shadow-
    owner: root
    group: shadow
    mode: 0600
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.7
    - scored
  when: debian12cis_rules_6_1_7
# 6.1.8 Ensure permissions on /etc/group- are configured
# It is critical to ensure that the /etc/group- file is protected from unauthorized access.
# Although it is protected by default, the file permissions could be changed either
# inadvertently or through malicious actions.
# Note: CIS for Debian 12 set this to 0600 while in "Debian family" this is set to 0644
- name: 6.1.8 Ensure permissions on /etc/group- are configured
  file:
    dest: /etc/group-
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.8
    - scored
  when: debian12cis_rules_6_1_8
# 6.1.9 Ensure permissions on /etc/gshadow are configured
# If attackers can gain read access to the /etc/gshadow file, they can easily run a password
# cracking program against the hashed password to break it. Other security information that
# is stored in the /etc/gshadow file (such as group administrators) could also be useful to
# subvert the group.
- name: 6.1.9 Ensure permissions on /etc/gshadow are configured
  file:
    dest: /etc/gshadow
    owner: root
    group: shadow
    mode: 0640
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.9
    - scored
  when: debian12cis_rules_6_1_9
# 6.1.10 Ensure no world writable files exist
# Data in world-writable files can be modified and compromised by any user on the system.
# World writable files may also indicate an incorrectly written script or program that could
# potentially be the cause of a larger compromise to the system's integrity.
- name: 6.1.10 Ensure no world writable files exist
  block:
    - name: 6.1.10 Ensure no world writable files exist - find files
      shell: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002 2> /dev/null && true || true
      changed_when: output_6_1_10.stdout | trim | length > 0
      register: output_6_1_10
      check_mode: no
    - name: 6.1.10 Ensure no world writable files exist - print output
      debug:
        msg: "{{ output_6_1_10.stdout_lines }}"
    - name: 6.1.10 Ensure no world writable files exist - fix permission
      file:
        path: "{{ item }}"
        mode: "o-w"
      with_items: "{{ output_6_1_10.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - warn
    - 6.1.10
    - scored
  when: debian12cis_rules_6_1_10
# 6.1.11 Ensure no unowned files or directories exist
# A new user who is assigned the deleted user's user ID or group ID may then end up
# "owning" these files, and thus have more access on the system than was intended.
- name: 6.1.11 Ensure no unowned files or directories exist
  block:
    - name: 6.1.11 Ensure no unowned files or directories exist - find
      shell: df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser 2> /dev/null && true || true
      changed_when: output_6_1_11.stdout | trim | length > 0
      register: output_6_1_11
      check_mode: no
    - name: 6.1.11 Ensure no unowned files or directories exist - print output
      debug:
        msg: "{{ output_6_1_11.stdout_lines }}"
    - name: 6.1.11 Ensure no unowned files or directories exist - fix
      file:
        path: "{{ item }}"
        owner: "{{ withoutOwnerFileDirOwner }}"
        group: "{{ withoutGroupFilesDirGroup }}"
      with_items: "{{ output_6_1_11.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.11
    - scored
  when: debian12cis_rules_6_1_11
# 6.1.12 Ensure no ungrouped files or directories exist
# A new user who is assigned the deleted user's user ID or group ID may then end up
# "owning" these files, and thus have more access on the system than was intended.
- name: 6.1.12 Ensure no ungrouped files or directories exist
  block:
    - name: 6.1.12 Ensure no ungrouped files or directories exist - find
      shell: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -nogroup 2> /dev/null && true || true
      changed_when: output_6_1_12.stdout | trim | length > 0
      register: output_6_1_12
      check_mode: no
    - name: 6.1.12 Ensure no ungrouped files or directories exist - print output
      debug:
        msg: "{{ output_6_1_12.stdout_lines }}"
    - name: 6.1.12 Ensure no ungrouped files or directories exist - fix
      file:
        path: "{{ item }}"
        owner: "{{ withoutOwnerFileDirOwner }}"
        group: "{{ withoutGroupFilesDirGroup }}"
      with_items: "{{ output_6_1_12.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.1.12
    - scored
  when: debian12cis_rules_6_1_12
# 6.1.13 Audit SUID executables
# There are valid reasons for SUID programs, but it is important to identify and review such
# programs to ensure they are legitimate.
- name: 6.1.13 Audit SUID executables
  block:
    - name: 6.1.13 Audit SUID executables - find
      shell: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -4000 2> /dev/null && true || true
      changed_when: output_6_1_13.stdout | trim | length > 0
      register: output_6_1_13
      check_mode: no
    - name: 6.1.13 Audit SUID executables - print output
      debug:
        msg: "{{ output_6_1_13.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.1.13
    - not-scored
  when: debian12cis_rules_6_1_13
# 6.1.14 Audit SGID executables
# There are valid reasons for SGID programs, but it is important to identify and review such
# programs to ensure they are legitimate. Review the files returned by the action in the audit
# section and check to see if system binaries have a different md5 checksum than what from
# the package. This is an indication that the binary may have been replaced.
- name: 6.1.14 Audit SGID executables
  block:
    - name: 6.1.14 Audit SGID executables - find
      shell: df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -2000 2> /dev/null && true || true
      changed_when: output_6_1_14.stdout | trim | length > 0
      register: output_6_1_14
      check_mode: no
    - name: 6.1.14 Audit SGID executables - print output
      debug:
        msg: "{{ output_6_1_14.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.1.14
    - not-scored
  when: debian12cis_rules_6_1_14
# 6.2 User and Group Settings
# 6.2.1 Ensure password fields are not empty
# All accounts must have passwords or be locked to prevent the account from being used by
# an unauthorized user.
- name: 6.2.1 Ensure password fields are not empty
  block:
    - name: 6.2.1  Ensure password fields are not empty - list
      shell: |
        awk -F: '($2 == "" ) { print $1 }' /etc/shadow
      changed_when: output_6_2_1.stdout | trim | length > 0
      register: output_6_2_1
      check_mode: no
    - name: 6.2.1 Ensure password fields are not empty - print output
      debug:
        msg: "{{ output_6_2_1.stdout_lines }}"
    - name: 6.2.1 Ensure password fields are not empty - lock account
      user:
        name: "{{ item }}"
        password_lock: yes
      with_items: "{{ output_6_2_1.stdout_lines }}"
      when:
        - "{{ output_6_2_1.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1
    - scored
  when: debian12cis_rules_6_2_1
# 6.2.2 Ensure no legacy "+" entries exist in /etc/passwd
# These entries may provide an avenue for attackers to gain privileged access on the system.
- name: 6.2.2 Ensure no legacy "+" entries exist in /etc/passwd
  block:
    - name: 6.2.2 Ensure no legacy "+" entries exist in /etc/passwd - list
      shell: |
        grep '^\+:' /etc/passwd && true || true
      changed_when: output_6_2_2.stdout | trim | length > 0
      register: output_6_2_2
      check_mode: no
    - name: 6.2.2 Ensure no legacy "+" entries exist in /etc/passwd - print output
      debug:
        msg: "{{ output_6_2_2.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.2
    - scored
  when: debian12cis_rules_6_2_2
# 6.2.3 Ensure all users' home directories exist
# If the user's home directory does not exist or is unassigned, the user will be placed in "/"
# and will not be able to write any files or have local environment variables set.
- name: 6.2.3 Ensure all users' home directories exist
  block:
    - name: 6.2.3 Ensure all users' home directories exist - list
      shell: |
        grep -E -v '^(halt|sync|shutdown)' /etc/passwd | awk -F: '($7 != "'"$(which nologin)"'" && $7 != "/bin/false") { print $1 " " $6 }' | while read -r user dir
        do
            if [ ! -d "$dir" ]; then
                echo "${user}"
            fi
        done
      changed_when: output_6_2_3.stdout | trim | length > 0
      register: output_6_2_3
      check_mode: no
    - name: 6.2.3 Ensure all users' home directories exist - print output
      debug:
        msg: "{{ output_6_2_3.stdout_lines }}"
    - name: 6.2.3 Ensure all users' home directories exist - fix
      user:
        name: "{{ item }}"
        create_home: yes
      with_items: "{{ output_6_2_3.stdout_lines }}"
      when: "{{ output_6_2_3.stdout_lines | length > 0 }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.3
    - scored
  when: debian12cis_rules_6_2_3
# 6.2.4 Ensure no legacy "+" entries exist in /etc/shadow
# These entries may provide an avenue for attackers to gain privileged access on the system.
- name: 6.2.4 Ensure no legacy "+" entries exist in /etc/shadow
  block:
    - name: 6.2.4 Ensure no legacy "+" entries exist in /etc/shadow - list
      shell: |
        grep '^\+:' /etc/shadow && true || true
      changed_when: output_6_2_4.stdout | trim | length > 0
      register: output_6_2_4
      check_mode: no
    - name: 6.2.4 Ensure no legacy "+" entries exist in /etc/shadow - print output
      debug:
        msg: "{{ output_6_2_4.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.4
    - scored
  when: debian12cis_rules_6_2_4
# 6.2.5 Ensure no legacy "+" entries exist in /etc/group
# These entries may provide an avenue for attackers to gain privileged access on the system.
- name: 6.2.5 Ensure no legacy "+" entries exist in /etc/group
  block:
    - name: 6.2.5 Ensure no legacy "+" entries exist in /etc/group - list
      shell: |
        grep '^\+:' /etc/group && true || true
      changed_when: output_6_2_5.stdout | trim | length > 0
      register: output_6_2_5
      check_mode: no
    - name: 6.2.4 Ensure no legacy "+" entries exist in /etc/group - print output
      debug:
        msg: "{{ output_6_2_5.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.5
    - scored
  when: debian12cis_rules_6_2_5
# 6.2.6 Ensure root is the only UID 0 account
# This access must be limited to only the default root account and only from the system
# console. Administrative access must be through an unprivileged account using an approved
# mechanism as noted in Item 5.6 Ensure access to the su command is restricted.
- name: 6.2.6 Ensure root is the only UID 0 account
  block:
    - name: 6.2.6 Ensure root is the only UID 0 account - list
      shell: |
        awk -F: '($3 == 0) { print $1 }' /etc/passwd | grep -v root && true || true
      changed_when: output_6_2_6.stdout | trim | length > 0
      register: output_6_2_6
      check_mode: no
    - name: 6.2.6 Ensure root is the only UID 0 account - print output
      debug:
        msg: "{{ output_6_2_6.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.6
    - scored
  when: debian12cis_rules_6_2_6
# 6.2.7 Ensure root PATH Integrity
# Including the current working directory (.) or other writable directory in root 's executable
# path makes it likely that an attacker can gain superuser access by forcing an administrator
# operating as root to execute a Trojan horse program.
- name: 6.2.7 Ensure root PATH Integrity
  block:
    - name: 6.2.7 Ensure root PATH Integrity - run
      script: 6_2_7.sh
      changed_when: output_6_2_7.stdout | trim | length > 0
      register: output_6_2_7
      check_mode: no
    - name: 6.2.7 Ensure root PATH Integrity - print output
      debug:
        msg: "{{ output_6_2_7.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.7
    - scored
  when: debian12cis_rules_6_2_7
# 6.2.8 Ensure users' home directories permissions are 750 or more restrictive
# Group or world-writable user home directories may enable malicious users to steal
# or modify other users' data or to gain another user's system privileges.
- name: 6.2.8 Ensure users' home directories permissions are 750 or more restrictive
  block:
    - name: 6.2.8 Ensure users home directories permissions are 750 or more restrictive - list
      script: 6_2_8.sh
      changed_when: output_6_2_8.stdout | trim | length > 0
      register: output_6_2_8
      check_mode: no
    - name: 6.2.8 Ensure users' home directories permissions are 750 or more restrictive - print missing dirs
      debug:
        msg: "{{ output_6_2_8.stdout | regex_search('.*does not exist.*', multiline=True) | trim }}"
      when: output_6_2_8.stdout | regex_search('.*does not exist.*', multiline=True) | trim | length > 0
    - name: 6.2.8 Ensure users' home directories permissions are 750 or more restrictive - print dirs to chmod
      debug:
        msg: "{{ output_6_2_8.stdout | regex_search('^\/.*', multiline=True) | trim }}"
    - name: 6.2.8 Ensure users home directories permissions are 750 or more restrictive - fix
      file:
        name: "{{ item }}"
        mode: "g-w,o-rwx"
      with_items: "{{ output_6_2_8.stdout | regex_search('^\/.*', multiline=True) | trim }}"
      when: (output_6_2_8.stdout | regex_search('^\/.*', multiline=True) | trim != 'None' and output_6_2_8.stdout | trim | length > 0)
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.8
    - scored
  when: debian12cis_rules_6_2_8
# 6.2.9 Ensure users own their home directories
# Since the user is accountable for files stored in the user home directory, the user must be
# the owner of the directory.
- name: 6.2.9 Ensure users own their home directories
  block:
    - name: 6.2.9 Ensure users own their home directories - list
      script: 6_2_9.sh
      changed_when: output_6_2_9.stdout | trim | length > 0
      register: output_6_2_9
      check_mode: no
    - name: 6.2.9 Ensure users own their home directories - print output
      debug:
        msg: "{{ output_6_2_9.stdout_lines }}"
    - name: 6.2.9 Ensure users own their home directories - fix
      file:
        path: "{{ item.split(',')[0] }}"
        group: "{{ item.split(',')[1] }}"
        owner: "{{ item.split(',')[1] }}"
        recurse: yes
      with_items: "{{ output_6_2_9.stdout_lines }}"
      when: output_6_2_9.stdout | trim | length > 0
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.9
    - scored
  when: debian12cis_rules_6_2_9
# 6.2.10 Ensure users' dot files are not group or world writable
# Group or world-writable user configuration files may enable malicious users to steal or
# modify other users' data or to gain another user's system privileges.
- name: 6.2.10 Ensure users dot files are not group or world writable
  block:
    - name: 6.2.10 Ensure users dot files are not group or world writable - list
      script: 6_2_10.sh
      changed_when: output_6_2_10.stdout | trim | length > 0
      register: output_6_2_10
      check_mode: no
    - name: 6.2.10 Ensure users' dot files are not group or world writable - print output
      debug:
        msg: "{{ output_6_2_10.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.10
    - scored
  when: debian12cis_rules_6_2_10
# 6.2.11 Ensure no users have .forward files
# Use of the .forward file poses a security risk in that sensitive data may be inadvertently
# transferred outside the organization. The .forward file also poses a risk as it can be used to
# execute commands that may perform unintended actions.
- name: 6.2.11 Ensure no users have .forward files
  block:
    - name: 6.2.11 Ensure no users have .forward files - list
      script: 6_2_11.sh
      changed_when: output_6_2_11.stdout | trim | length > 0
      register: output_6_2_11
      check_mode: no
    - name: 6.2.11 Ensure no users have .forward files  - print output
      debug:
        msg: "{{ output_6_2_11.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.11
    - scored
  when: debian12cis_rules_6_2_11
# 6.2.12 Ensure no users have .netrc files
# The .netrc file presents a significant security risk since it stores passwords in unencrypted
# form. Even if FTP is disabled, user accounts may have brought over .netrc files from other
# systems which could pose a risk to those systems.
- name: 6.2.12 Ensure no users have .netrc files
  block:
    - name: 6.2.12 Ensure no users have .netrc files - list
      script: 6_2_12.sh
      changed_when: output_6_2_12.stdout | trim | length > 0
      register: output_6_2_12
      check_mode: no
    - name: 6.2.12 Ensure no users have .netrc files - print output
      debug:
        msg: "{{ output_6_2_12.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.12
    - scored
  when: debian12cis_rules_6_2_12
# 6.2.13 Ensure users' .netrc Files are not group or world accessible
# .netrcfiles may contain unencrypted passwords that may be used to attack other systems.
- name: 6.2.13 Ensure users' .netrc Files are not group or world accessible
  block:
    - name: 6.2.13 Ensure users' .netrc Files are not group or world accessible - list
      script: 6_2_13.sh
      changed_when: output_6_2_13.stdout | trim | length > 0
      register: output_6_2_13
      check_mode: no
    - name: 6.2.13 Ensure users' .netrc Files are not group or world accessible - print output
      debug:
        msg: "{{ output_6_2_13.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.13
    - scored
  when: debian12cis_rules_6_2_13
# 6.2.14 Ensure no users have .rhosts files
# This action is only meaningful if .rhosts support is permitted in the file /etc/pam.conf.
# Even though the .rhosts files are ineffective if support is disabled in /etc/pam.conf, they
# may have been brought over from other systems and could contain information useful to
# an attacker for those other systems.
- name: 6.2.14 Ensure no users have .rhosts files
  block:
    - name: 6.2.14 Ensure no users have .rhosts files - list
      script: 6_2_14.sh
      changed_when: output_6_2_14.stdout | default([]) | trim | length > 0
      register: output_6_2_14
      check_mode: no

    - name: 6.2.14 Ensure no users have .rhosts files - print output
      debug:
        msg: "{{ output_6_2_14.stdout_lines | default([]) }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.14
    - scored
  when: debian12cis_rules_6_2_14
# 6.2.15 Ensure all groups in /etc/passwd exist in /etc/group
# Groups defined in the /etc/passwd file but not in the /etc/group file pose a threat to
# system security since group permissions are not properly managed.
- name: 6.2.15 Ensure all groups in /etc/passwd exist in /etc/group
  block:
    - name: 6.2.15 Ensure all groups in /etc/passwd exist in /etc/group - list
      shell: |
        for i in $(cut -s -d: -f4 /etc/passwd | sort -u); do
            grep -q -P "^.*?:[^:]*:$i:" /etc/group
            if [ $? -ne 0 ]; then
                echo "Group $i is referenced by /etc/passwd but does not exist in /etc/group"
            fi
        done
      changed_when: output_6_2_15.stdout | trim | length > 0
      register: output_6_2_15
      check_mode: no
    - name: 6.2.15 Ensure all groups in /etc/passwd exist in /etc/group - print output
      debug:
        msg: "{{ output_6_2_15.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.15
    - scored
  when: debian12cis_rules_6_2_15

# 6.2.16 Ensure no duplicate UIDs exist
# Users must be assigned unique UIDs for accountability and to ensure appropriate access
# protections.
- name: 6.2.16 Ensure no duplicate UIDs exist
  block:
    - name: 6.2.16 Ensure no duplicate UIDs exist - list
      shell: |
        cut -f3 -d":" /etc/passwd | sort -n | uniq -c | while read x; do
            [ -z "$x" ] && break
            set - $x
            if [ $1 -gt 1 ]; then
                users=$(awk -F: '($3 == n) { print $1 }' n=$2 /etc/passwd | xargs)
                echo "Duplicate UID ($2): $users"
            fi
        done
      changed_when: output_6_2_16.stdout | trim | length > 0
      register: output_6_2_16
      check_mode: no
    - name: 6.2.16 Ensure no duplicate UIDs exist - print output
      debug:
        msg: "{{ output_6_2_16.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.16
    - scored
  when: debian12cis_rules_6_2_16
# 6.2.17 Ensure no duplicate GIDs exist
# User groups must be assigned unique GIDs for accountability and to ensure appropriate
# access protections.
- name: 6.2.17 Ensure no duplicate GIDs exist
  block:
    - name: 6.2.17 Ensure no duplicate GIDs exist - list
      shell: |
        cut -d: -f3 /etc/group | sort | uniq -d | while read x; do
            echo "Duplicate GID ($x) in /etc/group"
        done
      changed_when: output_6_2_17.stdout | trim | length > 0
      register: output_6_2_17
      check_mode: no
    - name: 6.2.17 Ensure no duplicate GIDs exist - print output
      debug:
        msg: "{{ output_6_2_17.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.17
    - scored
  when: debian12cis_rules_6_2_17
# 6.2.18 Ensure no duplicate user names exist
# If a user is assigned a duplicate user name, it will create and have access to files with the
# first UID for that username in /etc/passwd . For example, if "test4" has a UID of 1000 and a
# subsequent "test4" entry has a UID of 2000, logging in as "test4" will use UID 1000.
# Effectively, the UID is shared, which is a security problem.
- name: 6.2.18 Ensure no duplicate user names exist
  block:
    - name: 6.2.18 Ensure no duplicate user names exist - list
      shell: |
        cut -d: -f1 /etc/passwd | sort | uniq -d | while read x; do
            echo "Duplicate login name ${x} in /etc/passwd"
        done
      changed_when: output_6_2_18.stdout | trim | length > 0
      register: output_6_2_18
      check_mode: no
    - name: 6.2.18 Ensure no duplicate user names exist - print output
      debug:
        msg: "{{ output_6_2_18.stdout_lines }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.18
    - scored
  when: debian12cis_rules_6_2_18
# 6.2.19 Ensure no duplicate group names exist
# If a group is assigned a duplicate group name, it will create and have access to files with the
# first GID for that group in /etc/group . Effectively, the GID is shared, which is a security
# problem.
- name: 6.2.19 Ensure no duplicate group names exist
  block:
    - name: 6.2.19 Ensure no duplicate group names exist - list
      shell: |
        cut -d: -f1 /etc/group | sort | uniq -d | while read x; do
            echo "Duplicate group name ${x} in /etc/group"
        done
      changed_when: output_6_2_19.stdout | trim | length > 0
      register: output_6_2_19
      check_mode: no
    - name: 6.2.19 Ensure no duplicate group names exist - print output
      debug:
        msg: "{{ output_6_2_19 }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.19
    - scored
  when: debian12cis_rules_6_2_19
# 6.2.20 Ensure shadow group is empty
# Any users assigned to the shadow group would be granted read access to the /etc/shadow
# file. If attackers can gain read access to the /etc/shadow file, they can easily run a password
# cracking program against the hashed passwords to break them. Other security information
# that is stored in the /etc/shadow file (such as expiration) could also be useful to subvert
# additional user accounts.
- name: 6.2.20 Ensure shadow group is empty
  block:
    - name: 6.2.20 Ensure shadow group is empty - list
      shell: |
        grep ^shadow:[^:]*:[^:]*:[^:]+ /etc/group
        awk -F: '($4 == "<shadow-gid>") { print }' /etc/passwd
      changed_when: output_6_2_20.stdout | trim | length > 0
      register: output_6_2_20
      check_mode: no
    - name: 6.2.20 Ensure shadow group is empty - print output
      debug:
        msg: "{{ output_6_2_20 }}"
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - manual_setup
    - 6.2.20
    - scored
  when: debian12cis_rules_6_2_20

# 6.1.1.2 Ensure auditd service is enabled
# The capturing of system events provides system administrators with information to allow
# them to determine if unauthorized access to their system is occurring.
- name: 6.1.1.2 Ensure auditd service is enabled
  service:
    name: auditd
    state: started
    enabled: true
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.1.2
    - scored
  when: debian12cis_rules_6_1_1_2
# 6.1.1.3 Ensure auditing for processes that start prior to auditd is enabled
# Audit events need to be captured on processes that start up prior to auditd , so that
# potential malicious activity cannot go undetected.
- name: 6.1.1.3 Ensure auditing for processes that start prior to auditd is enabled
  replace:
    dest: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=(?!.*audit)\"[^\"]*)(\".*)'
    replace: '\1 audit=1\2'
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.1.3
    - scored
  when: debian12cis_rules_6_1_1_3
# 6.1.1.4 Ensure audit_backlog_limit is sufficient
# during boot if audit=1, then the backlog will hold 64 records. If more that 64 records are
# created during boot, auditd records will be lost and potential malicious activity could go
# undetected.
- name: 6.1.1.4 Ensure audit_backlog_limit is sufficient
  replace:
    dest: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=(?!.*audit_backlog_limit)\"[^\"]*)(\".*)'
    replace: '\1 audit_backlog_limit={{ grub_backlog_limit | default(8192) }}\2'
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.1.4
    - scored
  when: debian12cis_rules_6_1_1_4
# 6.1.2 Configure Data Retention
# 6.1.2.1 Ensure audit log storage size is configured
# Configure the maximum size of the audit log file. Once the log reaches the maximum size, it
# will be rotated and a new log file will be started.
- name: 6.1.2.1 Ensure audit log storage size is configured
  lineinfile:
    dest: /etc/audit/auditd.conf
    regexp: "^max_log_file( |=)"
    line: "max_log_file = {{ max_log_file }}"
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.2.1
    - scored
  when: debian12cis_rules_6_1_2_1
# 6.1.2.2 Ensure audit logs are not automatically deleted
# The max_log_file_action setting determines how to handle the audit log file reaching the
# max file size. A value of keep_logs will rotate the logs but never delete old logs.
- name: 6.1.2.2 Ensure audit logs are not automatically deleted
  lineinfile:
    dest: /etc/audit/auditd.conf
    regexp: "^max_log_file_action"
    line: "max_log_file_action = {{ max_log_file_action }}"
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.2.2
    - scored
  when: debian12cis_rules_6_1_2_2

# 6.1.2.3 Ensure system is disabled when audit logs are full
# The auditd daemon can be configured to halt the system when the audit logs are full.
# In high security contexts, the risk of detecting unauthorized access or nonrepudiation
# exceeds the benefit of the system's availability.
- name: 6.1.2.3 Ensure system is disabled when audit logs are full
  block:
    - name: 6.1.2.3 Ensure system is disabled when audit logs are full - admin_space_left_action
      lineinfile:
        dest: /etc/audit/auditd.conf
        regexp: "^admin_space_left_action"
        line: "admin_space_left_action = {{ admin_space_left_action }}"
    - name: 6.1.2.3 Ensure system is disabled when audit logs are full - space_left_action
      lineinfile:
        dest: /etc/audit/auditd.conf
        regexp: "^space_left_action"
        line: "space_left_action = {{ space_left_action }}"
    - name: 6.1.2.3 Ensure system is disabled when audit logs are full - action_mail_acct
      lineinfile:
        dest: /etc/audit/auditd.conf
        regexp: "^action_mail_acct"
        line: "action_mail_acct = {{ action_mail_acct }}"
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.2.3
    - scored
  when: debian12cis_rules_6_1_2_3
# 6.1.3 Ensure events that modify date and time information are collected
# Unexpected changes in system date and/or time could be a sign of malicious activity on the system.
- name: 6.1.3 Ensure events that modify date and time information are collected
  template:
    src: auditd/time-change.rules.j2
    dest: /etc/audit/rules.d/time-change.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.3
    - scored
  when: debian12cis_rules_6_1_3
# 6.1.4 Ensure events that modify user/group information are collected
# # Unexpected changes to these files could be an indication that the system has been compromised and that an unauthorized user is attempting to hide their activities or compromise additional accounts.
- name: 6.1.4 Ensure events that modify user/group information are collected
  template:
    src: auditd/identity.rules.j2
    dest: /etc/audit/rules.d/identity.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.4
    - scored
  when: debian12cis_rules_6_1_4
# 6.1.5 Ensure events that modify the system's network environment are collected
# Monitoring sethostname and setdomainname will identify potential unauthorized changes to host and domainname of a system. The changing of these names could potentially break
# security parameters that are set based on those names. The /etc/hosts file is monitored for changes in the file that can indicate an unauthorized intruder is trying to change
# machine associations with IP addresses and trick users and processes into connecting to unintended machines. Monitoring /etc/issue and /etc/issue.net is important, as
# intruders could put disinformation into those files and trick users into providing information to the intruder. Monitoring /etc/network is important as it can show if
# network interfaces or scripts are being modified in a way that can lead to the machine becoming unavailable or compromised. All audit records will be tagged with the identifier "system-locale."
- name: 6.1.5 Ensure events that modify the system's network environment are collected
  template:
    src: auditd/system-locale.rules.j2
    dest: /etc/audit/rules.d/system-locale.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.5
    - scored
  when: debian12cis_rules_6_1_5
# 6.1.6 Ensure events that modify the system's Mandatory Access Controls are collected
# # Changes to files in these directories could indicate that an unauthorized user is attempting to modify access controls and change security contexts, leading to a compromise of the system.
- name: 6.1.6 Ensure events that modify the system's Mandatory Access Controls are collected
  template:
    src: auditd/MAC-policy.rules.j2
    dest: /etc/audit/rules.d/MAC-policy.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.6
    - scored
  when: debian12cis_rules_6_1_6
# 6.1.7 Ensure login and logout events are collected
# Monitoring login/logout events could provide a system administrator with information associated with brute force attacks against user logins.
- name: 6.1.7 Ensure login and logout events are collected
  template:
    src: auditd/logins.rules.j2
    dest: /etc/audit/rules.d/logins.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.7
    - scored
  when: debian12cis_rules_6_1_7
# 6.1.8 Ensure session initiation information is collected
# # Monitoring these files for changes could alert a system administrator to logins occurring at unusual hours, which could indicate intruder activity (i.e. a user logging in at a time when they do not normally log in).
- name: 6.1.8 Ensure session initiation information is collected
  template:
    src: auditd/session.rules.j2
    dest: /etc/audit/rules.d/session.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.8
    - scored
  when: debian12cis_rules_6_1_8
# 6.1.9 Ensure discretionary access control permission modification events are collected
# Monitoring for changes in file attributes could alert a system administrator to activity that could indicate intruder activity or policy violation.
- name: 6.1.9 Ensure discretionary access control permission modification events are collected
  template:
    src: auditd/perm_mod.rules.j2
    dest: /etc/audit/rules.d/perm_mod.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.9
    - scored
  when: debian12cis_rules_6_1_9
# 6.1.10 Ensure unsuccessful unauthorized file access attempts are collected
# Failed attempts to open, create or truncate files could be an indication that an individual or
# process is trying to gain unauthorized access to the system.
- name: 6.1.10 Ensure unsuccessful unauthorized file access attempts are collected
  template:
    src: auditd/audit.rules.j2
    dest: /etc/audit/rules.d/audit.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.10
    - scored
  when: debian12cis_rules_6_1_10
# 6.1.11 Ensure use of privileged commands is collected
# Execution of privileged commands by non-privileged users could be an indication of
# someone trying to gain unauthorized access to the system.
- name: 6.1.11 Ensure use of privileged commands is collected
  block:
    - name: 6.1.11 Ensure use of privileged commands is collected - get data
      shell: find / -xdev \( -perm -4000 -o -perm -2000 \) -type f | awk '{print "-a always,exit -F path=" $1 " -F perm=x -F auid>='"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"' -F auid!=4294967295 -k privileged" }'
      register: output_4_1_11
      changed_when: output_4_1_11.rc != 0
    - name: 6.1.11 Ensure use of privileged commands is collected - apply
      template:
        src: auditd/privileged.rules.j2
        dest: /etc/audit/rules.d/privileged.rules
        owner: root
        group: root
        mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.11
    - scored
  when: debian12cis_rules_6_1_11
# 6.1.12 Ensure successful file system mounts are collected
# It is highly unusual for a non privileged user to mount file systems to the system. While tracking mount commands gives the system administrator evidence that external media
# may have been mounted (based on a review of the source of the mount and confirming it's an external media type), it does not conclusively indicate that data was exported to the
# media. System administrators who wish to determine if data were exported, would also have to track successful open , creat and truncate system calls requiring write access to a
# file under the mount point of the external media file system. This could give a fair indication that a write occurred. The only way to truly prove it, would be to track
# successful writes to the external media. Tracking write system calls could quickly fill up the audit log and is not recommended. Recommendations on configuration options to track data export to media is beyond the scope of this document.
- name: 6.1.12 Ensure successful file system mounts are collected
  template:
    src: auditd/system_mounts.rules.j2
    dest: /etc/audit/rules.d/system_mounts.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.12
    - scored
  when: debian12cis_rules_6_1_12
# 6.1.13 Ensure file deletion events by users are collected
# Monitoring these calls from non-privileged users could provide a system administrator with evidence that inappropriate removal of files and file attributes associated with
# protected files is occurring. While this audit option will look at all events, system administrators will want to look for specific privileged files that are being deleted or altered.
- name: 6.1.13 Ensure file deletion events by users are collected
  template:
    src: auditd/delete.rules.j2
    dest: /etc/audit/rules.d/delete.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.13
    - scored
  when: debian12cis_rules_6_1_13
# 6.1.14 Ensure changes to system administration scope (sudoers) is collected
# Changes in the /etc/sudoers file can indicate that an unauthorized change has been made to scope of system administrator activity.
- name: 6.1.14 Ensure changes to system administration scope (sudoers) is collected
  template:
    src: auditd/scope.rules.j2
    dest: /etc/audit/rules.d/scope.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.14
    - scored
  when: debian12cis_rules_6_1_14
# 6.1.15 Ensure system administrator actions (sudolog) are collected
# Changes in /var/log/sudo.log indicate that an administrator has executed a command or
# the log file itself has been tampered with. Administrators will want to correlate the events
# written to the audit trail with the records written to /var/log/sudo.log to verify if
# unauthorized commands have been executed.
- name: 6.1.15 Ensure system administrator actions (sudolog) are collected
  template:
    src: auditd/actions.rules.j2
    dest: /etc/audit/rules.d/actions.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.15
    - scored
  when: debian12cis_rules_6_1_15
# 6.1.16 Ensure kernel module loading and unloading is collected
# Monitoring the use of insmod , rmmod and modprobe could provide system administrators
# with evidence that an unauthorized user loaded or unloaded a kernel module, possibly
# compromising the security of the system. Monitoring of the init_module and
# delete_module system calls would reflect an unauthorized user attempting to use a
# different program to load and unload modules.
- name: 6.1.16 Ensure kernel module loading and unloading is collected
  template:
    src: auditd/modules.rules.j2
    dest: /etc/audit/rules.d/modules.rules
    owner: root
    group: root
    mode: 0600
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.16
    - scored
  when: debian12cis_rules_6_1_16
# 6.1.17 Ensure the audit configuration is immutable
# In immutable mode, unauthorized users cannot execute changes to the audit system to
# potentially hide malicious activity and then put the audit rules back. Users would most
# likely notice a system reboot and that could alert administrators of an attempt to make
# unauthorized audit changes.
- name: 6.1.17 Ensure the audit configuration is immutable
  block:
    - name: 6.1.17 Ensure the audit configuration is immutable - finalize
      template:
        src: auditd/99-finalize.rules.j2
        dest: /etc/audit/rules.d/99-finalize.rules
        owner: root
        group: root
        mode: 0600
    - name: 6.1.17 Ensure the audit configuration is immutable - init
      template:
        src: auditd/11-init.rules.j2
        dest: /etc/audit/rules.d/11-init.rules
        owner: root
        group: root
        mode: 0600
      notify:
        - audit rules load
        - auditd restart
  ignore_errors: true
  tags:
    - section6
    - level_2_server
    - level_2_workstation
    - 6.1.17
    - scored
  when: debian12cis_rules_6_1_17
# 6.2 Configure Logging
# 6.2.1 Configure rsyslog
# 6.2.1.1 Ensure rsyslog is installed
# The security enhancements of rsyslog such as connection-oriented (i.e. TCP) transmission
# of logs, the option to log to database formats, and the encryption of log data en route to a
# central logging server) justify installing and configuring the package.
- name: 6.2.1.1 Ensure rsyslog is installed
  apt:
    name: rsyslog
    state: present
    install_recommends: false
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.1
    - scored
  when: debian12cis_rules_6_2_1_1
# 6.2.1.2 Ensure rsyslog Service is enabled
# If the rsyslog service is not activated the system may default to the syslogd service or lack
# logging instead.
- name: 6.2.1.2 Ensure rsyslog Service is enabled
  service:
    name: rsyslog
    enabled: yes
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.2
    - scored
  when: debian12cis_rules_6_2_1_2
# 6.2.1.3 Ensure logging is configured
# The /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files specifies rules for logging and
# which files are to be used to log certain classes of messages.
# A great deal of important security-related information is sent via rsyslog (e.g., successful
# and failed su attempts, failed login attempts, root login attempts, etc.).
- name: 6.2.1.3 Ensure logging is configured
  template:
    src: rsyslog.conf.j2
    dest: /etc/rsyslog.conf
    backup: yes
    owner: root
    group: root
    mode: 0644
  notify:
    - rsyslog restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.3
    - not-scored
  when: debian12cis_rules_6_2_1_3
# 6.2.1.4 Ensure rsyslog default file permissions configured
# It is important to ensure that log files have the correct permissions to ensure that sensitive
# data is archived and protected.
- name: 6.2.1.4 Ensure rsyslog default file permissions configured
  lineinfile:
    dest: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode (0640)?'
    line: "$FileCreateMode 0640"
  notify:
    - rsyslog restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.4
    - scored
  when: debian12cis_rules_6_2_1_4
# 6.2.1.5 Ensure rsyslog is configured to send logs to a remote log host
# # Storing log data on a remote host protects log integrity from local attacks. If an attacker
# gains root access on the local system, they could tamper with or remove log data that is
# stored on the local system
- name: 6.2.1.5 Ensure rsyslog is configured to send logs to a remote log host
  block:
    - name: 6.2.1.5 Ensure rsyslog is configured to send logs to a remote log host - check for omfwd
      shell: |
        grep '^\*.\* action(type="omfwd"' /etc/rsyslog.conf && true || true
      register: output_4_2_1_5
      changed_when: output_4_2_1_5.stdout | trim | length == 0
      check_mode: no
    - name: 6.2.1.5 Ensure rsyslog is configured to send logs to a remote log host - print output
      debug:
        msg: "{{ output_4_2_1_5.stdout_lines }}"
    - name: 6.2.1.5 Ensure rsyslog is configured to send logs to a remote log host - add omfwd
      lineinfile:
        path: /etc/rsyslog.conf
        backup: yes
        line: '*.* action(type="omfwd" target="{{ remoteSyslog.host }}" port="{{ remoteSyslog.port }}" protocol="{{ remoteSyslog.protocol }}" action.resumeRetryCount="100" queue.type="LinkedList" queue.size="1000")'
      when: output_4_2_1_5.stdout | trim | length == 0
      notify:
        - rsyslog restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.5
    - scored
  when: debian12cis_rules_6_2_1_5 and
        remoteSyslog.enable == True
# 6.2.1.6 Ensure remote rsyslog messages are only accepted on designated log hosts
# The guidance in the section ensures that remote log hosts are configured to only accept
# rsyslog data from hosts within the specified domain and that those systems that are not
# designed to be log hosts do not accept any remote rsyslog messages. This provides
# protection from spoofed log data and ensures that system administrators are reviewing
# reasonably complete syslog data in a central location.
- name: 6.2.1.6 Ensure remote rsyslog messages are only accepted on designated log hosts
  block:
    - name: 6.2.1.6 Ensure remote rsyslog messages are only accepted on designated log hosts - load imtcp
      lineinfile:
        dest: /etc/rsyslog.conf
        regexp: '^#module(load="imtcp")'
        line: '#module(load="imtcp")'
    - name: 6.2.1.6 Ensure remote rsyslog messages are only accepted on designated log hosts - port 514
      lineinfile:
        dest: /etc/rsyslog.conf
        regexp: '^#input(type="imtcp" port="514")'
        line: '#input(type="imtcp" port="514")'
      notify:
        - rsyslog restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.1.6
    - not-scored
  when: debian12cis_rules_6_2_1_6
# 6.2.2 Configure journald
# 6.2.2.1 Ensure journald is configured to send logs to rsyslog
# Storing log data on a remote host protects log integrity from local attacks. If an attacker
# gains root access on the local system, they could tamper with or remove log data that is
# stored on the local system.
- name: 6.2.2.1 Ensure journald is configured to send logs to rsyslog
  lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "(#)?ForwardToSyslog=(yes|no)"
    line: ForwardToSyslog=yes
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.2.1
    - scored
  when: debian12cis_rules_6_2_2_1
# 6.2.2.2 Ensure journald is configured to compress large log files
# The journald system includes the capability of compressing overly large files to avoid filling
# up the system with logs or making the logs unmanageably large.
- name: 6.2.2.2 Ensure journald is configured to compress large log files
  lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "(#)?Compress=(yes|no)"
    line: Compress=yes
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.2.2
    - scored
  when: debian12cis_rules_6_2_2_2
# 6.2.2.3 Ensure journald is configured to write logfiles to persistent disk
# Writing log data to disk will provide the ability to forensically reconstruct events which
# may have impacted the operations or security of a system even after a system crash or reboot.
- name: 6.2.2.3 Ensure journald is configured to write logfiles to persistent disk
  lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "(#)?Storage=(auto|persistent)"
    line: Storage=persistent
  notify:
    - journald restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.2.3
    - scored
  when: debian12cis_rules_6_2_2_3
# 6.2.3 Ensure permissions on all logfiles are configured
# It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived and protected.
- name: 6.2.3 Ensure permissions on all logfiles are configured
  shell: |
    find /var/log -type f -exec chmod g-wx,o-rwx "{}" + -o -type d -exec chmod g-w,o-rwx "{}" +
  register: output_4_2_3
  changed_when: output_4_2_3.stdout_lines | length > 0
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - 6.2.3
    - scored
  when: debian12cis_rules_6_2_3
# 6.3 Ensure logrotate is configured
# The system includes the capability of rotating log files regularly to avoid filling up the
# system with logs or making the logs unmanageably large. The file
# /etc/logrotate.d/rsyslog is the configuration file used to rotate log files created
# by rsyslog.
# By keeping the log files smaller and more manageable, a system administrator can easily
# archive these files to another system and spend less time looking through inordinately
# large log files.
- name: 6.3 Ensure logrotate is configured
  block:
    - name: 6.3 Ensure logrotate is configured - set logrotate policy
      replace:
        path: /etc/logrotate.d/rsyslog
        regexp: '^(\s*)(daily|weekly|monthly|yearly)$'
        replace: "\\1{{ logrotate_policy }}"
    - name: 6.3 Ensure logrotate is configured - check for /var/log/warn
      shell: |
        grep '^/var/log/warn$' /etc/logrotate.d/rsyslog && true || true
      register: output_4_3
      changed_when: output_4_3.stdout | trim | length == 0
      check_mode: no
    - name: 6.3 Ensure logrotate is configured - print output
      debug:
        msg: "{{ output_4_3.stdout_lines }}"
    - name: 6.3 Ensure logrotate is configured - add /var/log/warn
      replace:
        path: /etc/logrotate.d/rsyslog
        regexp: '^{$'
        replace: "/var/log/warn\n{"
      when: output_4_3.stdout | trim | length == 0
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - "4.3"
    - not-scored
  when: debian12cis_rules_6_3
# 6.4 Ensure logrotate assigns appropriate permissions
# It is important to ensure that log files have the correct permissions to ensure that sensitive
# data is archived and protected.
- name: 6.4 Ensure logrotate assigns appropriate permissions
  lineinfile:
    dest: /etc/logrotate.conf
    regexp: "^create"
    line: "create 0640 root utmp"
  notify:
    - journald restart
  tags:
    - section6
    - level_1_server
    - level_1_workstation
    - "4.4"
    - scored
  when: debian12cis_rules_6_4