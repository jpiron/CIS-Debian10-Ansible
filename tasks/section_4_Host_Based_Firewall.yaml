---
# 4 Host based firewall
# 4.1 Configure UncomplicatedFirewall (auditd)
# 4.1.1 Ensure ufw is installed
# The Uncomplicated Firewall (ufw) is a frontend for iptables and is particularly well-suited for host-based firewalls. ufw provides a framework for managing netfilter, as well as a command-line interface for manipulating the firewall
# A firewall utility is required to configure the Linux kernel's netfilter framework via the iptables or nftables back-end.
- name: 4.1.1 Ensure ufw is installed
  apt:
    name: ufw
    state: present
    install_recommends: false
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.1.1
    - scored
  when: debian12cis_rules_4_1_1 and
        enable_firewall and
        firewall_type == "ufw"
# 4.1.2 Ensure iptables-persistent is not installed with ufw
# The iptables-persistent is a boot-time loader for netfilter rules, iptables plugin
# Running both ufw and the services included in the iptables-persistent package may lead to conflict
- name: 4.1.2 Ensure iptables-persistent is not installed with ufw
  apt:
    name: ["iptables", "iptables-persistent"]
    state: absent
    purge: true
    autoremove: true
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.1.2
    - scored
  when: debian12cis_rules_4_1_2 and
        enable_firewall and
        firewall_type == "ufw"
# 4.1.3 Ensure ufw service is enabled
# UncomplicatedFirewall (ufw) is a frontend for iptables.
# ufw provides a framework for managing netfilter, as well as a command-line and available graphical user interface for manipulating the firewall.
- name: 4.1.3 Ensure ufw service is enabled
  service:
    name: ufw.service
    state: enabled
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.1.3
    - scored
  when: debian12cis_rules_4_1_3 and
        enable_firewall and
        firewall_type == "ufw"
# 4.1.4 Ensure ufw loopback traffic is configured
# Configure the loopback interface to accept traffic. Configure all other interfaces to deny traffic to the loopback network (127.0.0.0/8 for IPv4 and ::1/128 for IPv6).
# Loopback traffic is generated between processes on machine and is typically critical to
# operation of the system. The loopback interface is the only place that loopback network
# (127.0.0.0/8 for IPv4 and ::1/128 for IPv6) traffic should be seen, all other interfaces
# should ignore traffic on this network as an anti-spoofing measure.
- name: 4.1.4 Ensure ufw loopback traffic is configured
  block:
    - name: 4.1.4 Ensure ufw loopback traffic is configured - ingress lo allow in
      ufw:
        rule: allow
        direction: in
        interface: lo
    - name: 4.1.4 Ensure ufw loopback traffic is configured - egress lo allow out
      ufw:
        rule: allow
        direction: out
        interface: lo
    - name: 4.1.4 Ensure ufw loopback traffic is configured  - ingress deny from lo network ipv4
      ufw:
        rule: deny
        direction: in
        from: "127.0.0.0/8"
    - name: 4.1.4 Ensure ufw loopback traffic is configured  - ingress deny from lo network ipv6
      ufw:
        rule: deny
        direction: in
        from: "::1"
      when: IPv6_is_enabled
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.1.4
    - scored
  when: debian12cis_rules_4_1_4 and
        enable_firewall and
        firewall_type == "ufw"
# 4.1.6 Ensure ufw firewall rules exist for all open ports
# Without a firewall rule configured for open ports default firewall policy will drop all
# packets to these ports.
- name: 4.1.6 Ensure ufw firewall rules exist for all open ports - enable "{{ item.desc }}"
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  with_items: "{{ list_of_ufw_rules_to_allow | default([]) }}"
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.1.6
    - scored
  when: debian12cis_rules_4_1_6 and
        enable_firewall and
        firewall_type == "ufw"
# 4.1.7 Ensure ufw default deny firewall policy
# A default deny policy on connections ensures that any unconfigured network usage will be
# rejected.
# With a default accept policy the firewall will accept any packet that is not configured to be
# denied. It is easier to white list acceptable usage than to black list unacceptable usage.
- name: 4.1.7 Ensure ufw default deny firewall policy
  shell: |
    ufw default deny incoming
    ufw default allow outgoing
    ufw default deny routed
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.1.7
    - scored
  when: debian12cis_rules_4_1_7 and
        enable_firewall and
        firewall_type == "ufw"
# 4.2 Configure nftables
# 4.2.1 Ensure nftables is installed
# nftables provides a new in-kernel packet classification framework that is based on a network-specific Virtual Machine (VM) and a new nft userspace command line tool.
# nftables reuses the existing Netfilter subsystems such as the existing hook infrastructure, the connection tracking system, NAT, userspace queuing and logging subsystem.
# nftables is a subsystem of the Linux kernel that can protect against threats originating from within a corporate network to include malicious mobile code and poorly configured software on a host.
- name: 4.2.1 Ensure nftables is installed
  apt:
    name: nftables
    state: present
    install_recommends: false
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.2.1
    - scored
  when: debian12cis_rules_4_2_1 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.2 Ensure ufw is uninstalled or disabled with nftables
# Uncomplicated Firewall (UFW) is a program for managing a netfilter firewall designed to be easy to use.
# Running both the nftables service and ufw may lead to conflict and unexpected results.
- name: 4.2.2 Ensure ufw is uninstalled or disabled with nftables
  apt:
    name: ufw
    state: absent
    purge: true
    autoremove: true
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.2.2
    - scored
  when: debian12cis_rules_4_2_2 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.4 Ensure a nftables table exists
# Tables hold chains. Each table only has one address family and only applies to packets of this family. *
# Tables can have one of five families.
# nftables doesn't have any default tables.
# Without a table being build, nftables will not filter network traffic.
- name: 4.2.4 Ensure a nftables table exists
  block:
    - name: 4.2.4 Ensure a nftables table exists - flush existing table
      shell: nft flush ruleset
    - name: 4.2.4 Ensure a nftables table exists - create new table
      shell: nft create table inet filter
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.2.4
    - scored
  when: debian12cis_rules_4_2_4 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.5 Ensure nftables base chains exist
# Chains are containers for rules. They exist in two kinds, base chains and regular chains. A
# base chain is an entry point for packets from the networking stack, a regular chain may be
# used as jump target and is used for better rule organization.
- name: 4.2.5 Ensure nftables base chains exist
  block:
    - name: 4.2.5 Ensure nftables base chains exist - chain INPUT
      shell: nft create chain inet filter INPUT { type filter hook input priority 0 \; }
    - name: 4.2.5 Ensure nftables base chains exist - chain FORWARD
      shell: nft create chain inet filter FORWARD { type filter hook forward priority 0 \; }
    - name: 4.2.5 Ensure nftables base chains exist - chain OUTPUT
      shell: nft create chain inet filter OUTPUT { type filter hook output priority 0 \; }
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.2.5
    - scored
  when: debian12cis_rules_4_2_5 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.6 Ensure nftables loopback traffic is configured
# Configure the loopback interface to accept traffic. Configure all other interfaces to deny
# traffic to the loopback network
- name: 4.2.6 Ensure nftables loopback traffic is configured
  block:
    - name: 4.2.6 Ensure nftables loopback traffic is configured - accept
      shell: nft add rule inet filter INPUT iif lo accept
    - name: 4.2.6 Ensure nftables loopback traffic is configured - drop
      shell: nft add rule inet filter INPUT ip saddr 127.0.0.0/8 counter drop
    - name: 4.2.6 Ensure nftables loopback traffic is configured - ipv6 drop
      shell: nft add rule inet filter INPUT ip6 saddr ::1 counter drop
      when: IPv6_is_enabled
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.2.6
    - scored
  when: debian12cis_rules_4_2_6 and
        enable_firewall and
        firewall_type == "nftables"
#  4.2.8 Ensure nftables default deny firewall policy
# Base chain policy is the default verdict that will be applied to packets reaching the end of
# the chain.
- name: 4.2.8 Ensure nftables default deny firewall policy
  block:
    # - name: 4.2.8 Ensure nftables default deny firewall policy - enable ssh
    #   shell: nft chain inet filter INPUT { tcp dport ssh accept \;}
    # - name: 4.2.8 Ensure nftables default deny firewall policy - enable ping
    #   shell: nft chain inet filter INPUT { ip protocol icmp accept \;}
    - name: 4.2.8 Ensure nftables default deny firewall policy - enable "{{ item.desc }}"
      shell: nft add rule inet filter INPUT "{{ item.rule }}"
      with_items: "{{ list_of_rules_to_allow | default([]) }}"
    - name: 4.2.8 Ensure nftables default deny firewall policy - input
      shell: nft chain inet filter INPUT { policy drop \; }
    - name: 4.2.8 Ensure nftables default deny firewall policy - forward
      shell: nft chain inet filter FORWARD { policy drop \; }
    - name: 4.2.8 Ensure nftables default deny firewall policy - output
      shell: nft chain inet filter OUTPUT { policy drop \; }
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.2.8
    - scored
  when: debian12cis_rules_4_2_8 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.9 Ensure nftables service is enabled
# The nftables service allows for the loading of nftables rulesets during boot, or starting
# on the nftables service
- name: 4.2.9 Ensure nftables service is enabled
  service:
    name: nftables
    state: started
    enabled: true
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.2.9
    - scored
  when: debian12cis_rules_4_2_9 and
        enable_firewall and
        firewall_type == "nftables"
# 4.2.10 Ensure nftables rules are permanent
# nftables is a subsystem of the Linux kernel providing filtering and classification of network packets/datagrams/frames.
# The nftables service reads the /etc/nftables.conf file for a nftables file or files to include in the nftables ruleset.
# A nftables ruleset containing the input, forward, and output base chains allow network traffic to be filtered.
# Changes made to nftables ruleset only affect the live system, you will also need to configure the nftables ruleset to apply on boot.
- name: 4.2.10 Ensure nftables rules are permanent
  lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.rules"'
    state: present
  notify: nftables restart
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.2.10
    - not-scored
  when: debian12cis_rules_4_2_10 and
        enable_firewall and
        firewall_type == "nftables"
# 4.3 Configure iptables
# 4.3.1 Configure iptables software
# 4.3.1.1 Ensure iptables packages are installed
# iptables is a utility program that allows a system administrator to configure the tables provided by the Linux kernel firewall, implemented as different Netfilter modules, and the chains and rules it stores.
# Different kernel modules and programs are used for different protocols; iptables applies to IPv4, ip6tables to IPv6, arptables to ARP, and ebtables to Ethernet frames.
# A method of configuring and maintaining firewall rules is necessary to configure a Host Based Firewall.
- name: 4.3.1.1 Ensure iptables is installed
  apt:
    name: ["iptables", "iptables-persistent"]
    state: present
    install_recommends: false
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.3.1.1
    - scored
  when: debian12cis_rules_4_3_1_1 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.1.2 Ensure nftables is not installed with iptables
# nftables is a subsystem of the Linux kernel providing filtering and classification of network packets/datagrams/frames and is the successor to iptables.
# Running both iptables and nftables may lead to conflict.
- name: 4.3.1.2 Ensure nftables is not installed with iptables
  apt:
    name: nftables
    state: absent
    purge: true
    autoremove: true
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.3.1.2
    - scored
  when: debian12cis_rules_4_3_1_2 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.1.3 Ensure ufw is uninstalled or disabled with iptables
# Running iptables.persistent with ufw enabled may lead to conflict and unexpected results.
- name: 4.3.1.3 Ensure ufw is uninstalled or disabled with iptables
  apt:
    name: ufw
    state: absent
    purge: true
    autoremove: true
  tags:
    - section4
    - level_2_server
    - level_2_workstation
    - 4.3.1.3
    - scored
  when: debian12cis_rules_4_3_1_3 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.2.1 Ensure iptables default deny firewall policy
# With a default accept policy the firewall will accept any packet that is not configured to be
# denied. It is easier to white list acceptable usage than to black list unacceptable usage.
- name: 4.3.2.1 Ensure iptables default deny firewall policy
  iptables:
    chain: "{{ item }}"
    policy: DROP
  with_items:
    - INPUT
    - FORWARD
    - OUTPUT
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.2.1
    - scored
  when: debian12cis_rules_4_3_2_1 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.2.4 Ensure iptables firewall rules exist for all open ports
# Without a firewall rule configured for open ports default firewall policy will drop all
# packets to these ports.
- name: 4.3.2.4 Ensure iptables firewall rules exist for all open ports - enable "{{ item.desc }}"
  iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    match: state
    ctstate: NEW
    jump: ACCEPT
  with_items: "{{ list_of_rules_to_allow | default([]) }}"
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.2.4
    - scored
  when: debian12cis_rules_4_3_2_4 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.2.2 Ensure iptables loopback traffic is configured
# Loopback traffic is generated between processes on machine and is typically critical to
# operation of the system. The loopback interface is the only place that loopback network
# (127.0.0.0/8) traffic should be seen, all other interfaces should ignore traffic on this
# network as an anti-spoofing measure.
- name: 4.3.2.2 Ensure iptables loopback traffic is configured
  block:
    - name: 4.3.2.2 Ensure iptables loopback traffic is configured - INPUT lo
      iptables:
        chain: INPUT
        in_interface: "lo"
        jump: ACCEPT
    - name: 4.3.2.2 Ensure iptables loopback traffic is configured - OUTPUT lo
      iptables:
        chain: OUTPUT
        out_interface: "lo"
        jump: ACCEPT
    - name: 4.3.2.2 Ensure iptables loopback traffic is configured - INPUT DROP
      iptables:
        chain: INPUT
        source: 127.0.0.0/8
        jump: DROP
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.2.2
    - scored
  when: debian12cis_rules_4_3_2_2 and
        enable_firewall and
        firewall_type == "iptables"
# 4.3.1 Configure iptables software
# 4.3.3.1 Ensure ip6tables default deny firewall policy
# With a default accept policy the firewall will accept any packet that is not configured to be
# denied. It is easier to white list acceptable usage than to black list unacceptable usage.
- name: 4.3.3.1 Ensure ip6tables default deny firewall policy
  iptables:
    chain: "{{ item }}"
    policy: DROP
  with_items:
    - INPUT
    - FORWARD
    - OUTPUT
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.3.1
    - scored
  when: debian12cis_rules_4_3_3_1 and
        enable_firewall and
        firewall_type == "ip6tables"
# 4.3.3.2 Ensure ip6tables loopback traffic is configured
# Loopback traffic is generated between processes on machine and is typically critical to
# operation of the system. The loopback interface is the only place that loopback network
# (127.0.0.0/8) traffic should be seen, all other interfaces should ignore traffic on this
# network as an anti-spoofing measure.
- name: 4.3.3.2 Ensure ip6tables loopback traffic is configured
  block:
    - name: 4.3.3.2 Ensure ip6tables loopback traffic is configured - INPUT lo
      iptables:
        chain: INPUT
        in_interface: "lo"
        jump: ACCEPT
    - name: 4.3.3.2 Ensure ip6tables loopback traffic is configured - OUTPUT lo
      iptables:
        chain: OUTPUT
        out_interface: "lo"
        jump: ACCEPT
    - name: 4.3.3.2 Ensure ip6tables loopback traffic is configured - INPUT DROP
      iptables:
        chain: INPUT
        source: ::1
        jump: DROP
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.3.2
    - scored
  when: debian12cis_rules_4_3_3_2 and
        enable_firewall and
        firewall_type == "ip6tables"
# 4.3.3.4 Ensure ip6tables firewall rules exist for all open ports
# Without a firewall rule configured for open ports default firewall policy will drop all
# packets to these ports.
- name: 4.3.3.4 Ensure ip6tables firewall rules exist for all open ports - enable "{{ item.desc }}"
  iptables:
    chain: INPUT
    protocol: "{{ item.proto }}"
    destination_port: "{{ item.port }}"
    match: state
    ctstate: NEW
    jump: ACCEPT
  with_items: "{{ list_of_rules_to_allow | default([]) }}"
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.3.3.4
    - scored
  when: debian12cis_rules_4_3_3_4 and
        enable_firewall and
        firewall_type == "ip6tables"
# 4.5.3.5 Ensure outbound and established connections are configured
# Configure the firewall rules for new outbound, and established connections
- name: 4.5.3.5 Ensure outbound and established connections are configured
  block:
    - name: 4.5.3.5 Ensure outbound and established connections are configured - input tcp
      shell: nft add rule inet filter INPUT ip protocol tcp ct state established accept
    - name: 4.5.3.5 Ensure outbound and established connections are configured - input udp
      shell: nft add rule inet filter INPUT ip protocol udp ct state established accept
    - name: 4.5.3.5 Ensure outbound and established connections are configured - input icmp
      shell: nft add rule inet filter INPUT ip protocol icmp ct state established accept
    - name: 4.5.3.5 Ensure outbound and established connections are configured - output tcp
      shell: nft add rule inet filter OUTPUT ip protocol tcp ct state new,related,established accept
    - name: 4.5.3.5 Ensure outbound and established connections are configured - output udp
      shell: nft add rule inet filter OUTPUT ip protocol udp ct state new,related,established accept
    - name: 4.5.3.5 Ensure outbound and established connections are configured - output icmp
      shell: nft add rule inet filter OUTPUT ip protocol icmp ct state new,related,established accept
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.5.3.5
    - not-scored
  when: debian12cis_rules_4_5_3_5 and
        enable_firewall and
        firewall_type == "nftables"
# 4.5.4.1.3 Ensure outbound and established connections are configured
# If rules are not in place for new outbound, and established connections all packets will be
# dropped by the default policy preventing network usage.
- name: 4.5.4.1.3 Ensure outbound and established connections are configured
  block:
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - OUTPUT tcp
      iptables:
        chain: OUTPUT
        protocol: tcp
        match: state
        ctstate: ESTABLISHED,NEW
        jump: ACCEPT
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - OUTPUT udp
      iptables:
        chain: OUTPUT
        protocol: udp
        match: state
        ctstate: ESTABLISHED,NEW
        jump: ACCEPT
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - OUTPUT icmp
      iptables:
        chain: OUTPUT
        protocol: icmp
        match: state
        ctstate: ESTABLISHED,NEW
        jump: ACCEPT
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - INPUT tcp
      iptables:
        chain: INPUT
        protocol: tcp
        match: state
        ctstate: ESTABLISHED
        jump: ACCEPT
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - INPUT udp
      iptables:
        chain: INPUT
        protocol: udp
        match: state
        ctstate: ESTABLISHED
        jump: ACCEPT
    - name: 4.5.4.1.3 Ensure outbound and established connections are configured - INPUT icmp
      iptables:
        chain: INPUT
        protocol: icmp
        match: state
        ctstate: ESTABLISHED
        jump: ACCEPT
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.5.4.1.3
    - not-scored
  when: debian12cis_rules_4_5_4_1_3 and
        enable_firewall and
        firewall_type == "iptables"
# 4.5.4.2 Configure IPv6 ip6tables
# 4.5.4.2.1 Ensure IPv6 default deny firewall policy
# With a default accept policy the firewall will accept any packet that is not configured to be
# denied. It is easier to white list acceptable usage than to black list unacceptable usage.
- name: 4.5.4.2.1 Ensure IPv6 default deny firewall policy
  iptables:
    chain: "{{ item }}"
    ip_version: ipv6
    policy: DROP
  with_items:
    - INPUT
    - FORWARD
    - OUTPUT
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.5.4.2.1
    - scored
  when: debian12cis_rules_4_5_4_2_1 and
        enable_firewall and
        firewall_type == "iptables" and
        IPv6_is_enabled
# 4.5.4.2.2 Ensure IPv6 loopback traffic is configured
# Loopback traffic is generated between processes on machine and is typically critical to
# operation of the system. The loopback interface is the only place that loopback network
# (::1) traffic should be seen, all other interfaces should ignore traffic on this network as an
# anti-spoofing measure.
- name: 4.5.4.2.2 Ensure IPv6 loopback traffic is configured
  block:
    - name: 4.5.4.2.2 Ensure IPv6 loopback traffic is configured - INPUT lo
      iptables:
        chain: INPUT
        ip_version: ipv6
        in_interface: "lo"
        jump: ACCEPT
    - name: 4.5.4.2.2 Ensure IPv6 loopback traffic is configured - OUTPUT lo
      iptables:
        chain: OUTPUT
        ip_version: ipv6
        out_interface: "lo"
        jump: ACCEPT
    - name: 4.5.4.2.2 Ensure IPv6 loopback traffic is configured - INPUT DROP
      iptables:
        chain: INPUT
        ip_version: ipv6
        source: ::1
        jump: DROP
  tags:
    - section4
    - level_1_server
    - level_1_workstation
    - 4.5.4.2.2
    - scored
  when: debian12cis_rules_4_5_4_2_2 and
        enable_firewall and
        firewall_type == "iptables" and
        IPv6_is_enabled
# 4.5.4.2.3 Ensure IPv6 outbound and established connections are configured
# If rules are not in place for new outbound, and established connections all packets will be
# dropped by the default policy preventing network usage.
- name: 4.5.4.2.3 Ensure IPv6 outbound and established connections are configured
  block:
    - name: 4.5.4.2.3 Ensure IPv6 outbound and established connections are configured - OUTPUT tcp
      iptables:
        chain: OUTPUT
        ip_version: ipv6
        protocol: tcp
        match: state
        ctstate: ESTABLISHED,NEW
        jump: ACCEPT
    - name: 4.5.4.2.3 Ensure IPv6 outbound and established connections are configured - OUTPUT udp
      iptables:
