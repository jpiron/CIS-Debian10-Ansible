---
# 5 Access control
# 5.1 Configure SSH Server
# 5.1.1 Ensure permissions on /etc/ssh/sshd_config are configured
# The /etc/ssh/sshd_config file needs to be protected from unauthorized changes by non-
# privileged users.
- name: 5.1.1 Ensure permissions on /etc/ssh/sshd_config are configured
  file:
    dest: /etc/ssh/sshd_config
    state: file
    owner: root
    group: root
    mode: 0600
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.1
    - scored
  when: debian12cis_rules_5_1_1
# 5.1.2 Ensure permissions on SSH private host key files are configured
# An SSH private key is one of two files used in SSH public key authentication.
# In this authentication method, the possession of the private key is proof of identity.
# Only a private key that corresponds to a public key will be able to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key should be distributed.
# If an unauthorized user obtains the private SSH host key file, the host could be
# impersonated
- name: 5.1.2 Ensure permissions on SSH private host key files are configured
  block:
    - name: 5.1.2 Ensure permissions on SSH private host key files are configured - find keys
      shell: |
        find /etc/ssh -xdev -type f -name 'ssh_host_*_key' && true || true
      register: output_5_1_2
      changed_when: output_5_1_2.rc != 0
      check_mode: no
    - name: 5.1.2 Ensure permissions on SSH private host key files are configured - fix permissions
      file:
        dest: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: 0600
      with_items: "{{ output_5_1_2.stdout_lines }}"
      when: output_5_1_2.stdout_lines | length > 0
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.2
    - scored
  when: debian12cis_rules_5_1_2
# 5.1.3 Ensure permissions on SSH public host key files are configured
# An SSH public key is one of two files used in SSH public key authentication.
# In this authentication method, a public key is a key that can be used for verifying digital signatures generated using a corresponding private key. Only a public key that corresponds to a private key will be able to authenticate successfully.
# If a public host key file is modified by an unauthorized user, the SSH service may be
# compromised.
- name: 5.1.3 Ensure permissions on SSH public host key files are configured
  block:
    - name: 5.1.3 Ensure permissions on SSH public host key files are configured - find keys
      shell: |
        find /etc/ssh -xdev -type f -name 'ssh_host_*_key.pub' && true || true
      register: output_5_1_3
      changed_when: output_5_1_3.rc != 0
      check_mode: no
    - name: 5.1.3 Ensure permissions on SSH public host key files are configured - fix permissions
      file:
        dest: "{{ item }}"
        state: file
        owner: root
        group: root
        mode: "go-wx"
      with_items: "{{ output_5_1_3.stdout_lines }}"
      when: output_5_1_3.stdout_lines | length > 0
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.3
    - scored
  when: debian12cis_rules_5_1_3
# 5.1.4 Ensure sshd access is configured
# Restricting which users can remotely access the system via SSH will help ensure that only authorized users access the system.
- name: 5.1.4 Ensure sshd access is configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?AllowUsers"
    line: "AllowUsers {{ list_of_os_users | join(' ') }}"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.4
    - scored
  when: debian12cis_rules_5_1_4
# 5.1.5 Ensure sshd banner is configured
# The Banner parameter specifies a file whose contents must be sent to the remote user before authentication is permitted.
# By default, no banner is displayed.
# Banners are used to warn connecting users of the particular site's policy regarding
# connection. Presenting a warning message prior to the normal user login may assist the
# prosecution of trespassers on the computer system.
- name: 5.1.5 Ensure sshd banner is configured
  block:
    - name: 5.1.5 Ensure sshd banner is configured - copy banner
      copy:
        src: banner
        dest: /etc/ssh/banner
        owner: root
        group: root
        mode: '0644'
    - name: 5.1.5 Ensure sshd banner is configured - config banner
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^Banner"
        line: "Banner /etc/ssh/banner"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.5
    - scored
  when: debian12cis_rules_5_1_5
# 5.1.6 Ensure sshd Ciphers are configured
# Weak ciphers that are used for authentication to the cryptographic module cannot be relied
# upon to provide confidentiality or integrity, and system data may be compromised
- name: 5.1.6 Ensure sshd Ciphers are configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^Ciphers"
    line: "Ciphers -3des-cbc,aes128-cbc,aes192-cbc,aes256-cbc,chacha20-poly1305@openssh.com"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.6
    - scored
  when: debian12cis_rules_5_1_6
# 5.1.7 Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
# Having no timeout value associated with a connection could allow an unauthorized user
# access to another user's ssh session (e.g. user walks away from their computer and doesn't
# lock the screen). Setting a timeout value at least reduces the risk of this happening.
- name: 5.1.7 Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  block:
    - name: 5.1.7 Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured - clientalive
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^(#)?ClientAliveInterval"
        line: "ClientAliveInterval 15"
    - name: 5.1.7 Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured - MaxAlive
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^(#)?ClientAliveCountMax"
        line: "ClientAliveCountMax 3"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.7
    - scored
  when: debian12cis_rules_5_1_7
# 5.1.10 Ensure sshd HostbasedAuthentication is disabled
# The HostbasedAuthentication parameter specifies if authentication is allowed through trusted hosts via the user of .rhosts , or /etc/hosts.equiv , along with successful public key client host authentication.
# Even though the .rhosts files are ineffective if support is disabled in /etc/pam.conf , disabling the ability to use .rhosts files in SSH provides an additional layer of protection.
- name: 5.1.10 Ensure sshd HostbasedAuthentication is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?HostbasedAuthentication"
    line: "HostbasedAuthentication no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.10
    - scored
  when: debian12cis_rules_5_1_10
# 5.1.11 Ensure sshd IgnoreRhosts is enabled
# The IgnoreRhosts parameter specifies that .rhosts and .shosts files will not be used in RhostsRSAAuthentication or HostbasedAuthentication.
# Setting this parameter forces users to enter a password when authenticating with SSH.
- name: 5.1.11 Ensure sshd IgnoreRhosts is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?IgnoreRhosts"
    line: "IgnoreRhosts no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.11
    - scored
  when: debian12cis_rules_5_1_11
# 5.1.12 Ensure only strong Key Exchange algorithms are used
# Key exchange methods that are considered weak should be removed. A key exchange
# method may be weak because too few bits are used, or the hashing algorithm is considered
# too weak. Using weak algorithms could expose connections to man-in-the-middle attacks
# Key exchange methods that are considered weak should be removed.
# A key exchange method may be weak because too few bits are used, or the hashing algorithm is considered too weak. Using weak algorithms could expose connections to man-in-the-middle attacks
- name: 5.1.12 Ensure only strong Key Exchange algorithms are used
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^KexAlgorithms"
    line: "KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.12
    - scored
  when: debian12cis_rules_5_1_12
# 5.1.13 Ensure sshd LoginGraceTime is configured
# The LoginGraceTime parameter specifies the time allowed for successful authentication to the SSH server.
# The longer the Grace period is the more open unauthenticated connections can exist.
# Like other session controls in this session the Grace Period should be limited to appropriate organizational limits to ensure the service is available for needed access.
- name: 5.1.13 Ensure sshd LoginGraceTime is configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?LoginGraceTime"
    line: "LoginGraceTime 60"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.13
    - scored
  when: debian12cis_rules_5_1_13
# 5.1.15 Ensure sshd MACs are configured
# This variable limits the types of MAC algorithms that SSH can use during communication.
# MD5 and 96-bit MAC algorithms are considered weak and have been shown to increase exploitability in SSH downgrade attacks. Weak algorithms continue to have a great deal of attention as a weak spot that can be exploited with expanded computing power. An attacker that breaks the algorithm could take advantage of a MiTM position to decrypt the SSH tunnel and capture credentials and information.
- name: 5.1.15 Ensure sshd MACs are configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?MACs"
    line: "MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac-64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmac-ripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64-etm@openssh.com,umac-128-etm@openssh.com"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.15
    - scored
  when: debian12cis_rules_5_1_15
# 5.1.16 Ensure sshd MaxAuthTries is configured
# The MaxAuthTries parameter specifies the maximum number of authentication attempts permitted per connection. When the login failure count reaches half the number, error messages will be written to the syslog file detailing the login failure.
# Setting the MaxAuthTries parameter to a low number will minimize the risk of successful brute force attacks to the SSH server. While the recommended setting is 4, set the number based on site policy.
- name: 5.1.16 Ensure sshd MaxAuthTries is configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?MaxAuthTries"
    line: "MaxAuthTries 4"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.16
    - scored
  when: debian12cis_rules_5_1_16
# 5.1.17 Ensure sshd MaxSessions is configured
# The MaxSessions parameter specifies the maximum number of open sessions permitted from a given connection.
# To protect a system from denial of service due to a large number of concurrent sessions, use the rate limiting function of MaxSessions to protect availability of sshd logins and prevent overwhelming the daemon.
- name: 5.1.17 Ensure sshd MaxSessions is configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?MaxSessions"
    line: "MaxSessions 10"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.17
    - scored
  when: debian12cis_rules_5_1_17
# 5.1.18 Ensure sshd MaxStartups is configured
# To protect a system from denial of service due to a large number of pending authentication
# connection attempts, use the rate limiting function of MaxStartups to protect availability of
# sshd logins and prevent overwhelming the daemon.
- name: 5.1.18 Ensure sshd MaxStartups is configured
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?MaxStartups"
    line: "MaxStartups 10:30:60"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.18
    - scored
  when: debian12cis_rules_5_1_18
# 5.1.19 Ensure sshd PermitEmptyPasswords is disabled
# The PermitEmptyPasswords parameter specifies if the SSH server allows login to accounts with empty password strings.
# Disallowing remote shell access to accounts that have an empty password reduces the
# probability of unauthorized access to the system
- name: 5.1.19 Ensure sshd PermitEmptyPasswords is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?PermitEmptyPasswords"
    line: "PermitEmptyPasswords no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.19
    - scored
  when: debian12cis_rules_5_1_19
# 5.1.20 Ensure sshd PermitRootLogin is disabled
# Disallowing root logins over SSH requires system admins to authenticate using their own
# individual account, then escalating to root via sudo or su . This in turn limits opportunity for
# non-repudiation and provides a clear audit trail in the event of a security incident
- name: 5.1.20 Ensure sshd PermitRootLogin is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?PermitRootLogin"
    line: "PermitRootLogin no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.20
    - scored
  when: debian12cis_rules_5_1_20
# 5.1.21 Ensure sshd PermitUserEnvironment is disabled
# Permitting users the ability to set environment variables through the SSH daemon could
# potentially allow users to bypass security controls (e.g. setting an execution path that has
# ssh executing trojan'd programs)
- name: 5.1.21 Ensure sshd PermitUserEnvironment is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?PermitUserEnvironment"
    line: "PermitUserEnvironment no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.21
    - scored
  when: debian12cis_rules_5_1_21
# 5.1.22 Ensure sshd PAM is enabled
# When usePAM is set to yes, PAM runs through account and session types properly. This is
# important if you want to restrict access to services based off of IP, time or other factors of
# the account. Additionally, you can make sure users inherit certain environment variables
# on login or disallow access to the server
- name: 5.1.22 Ensure SSH PAM is enabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^UsePAM"
    line: "UsePAM yes"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.1.22
    - scored
  when: debian12cis_rules_5_1_22
# 5.2.2 Ensure sudo commands use pty
# sudo can be configured to run only from a pseudo-pty
- name: 5.2.2 Ensure sudo commands use pty
  lineinfile:
    dest: /etc/sudoers.d/cis
    state: present
    create: yes
    regexp: "^Defaults use_pty"
    line: "Defaults use_pty"
    validate: "visudo -cf %s"
  tags:
    - section5
    - level_5_server
    - level_5_workstation
    - 5.2.2
    - scored
  when: debian12cis_rules_5_2_2
# 5.2.3 Ensure sudo log file exists
# sudo can use a custom log file.
# A sudo log file simplifies auditing of sudo commands.
- name: 5.2.3 Ensure sudo log file exists
  lineinfile:
    dest: /etc/sudoers.d/cis
    state: present
    create: yes
    regexp: "^Defaults logfile.*"
    line: 'Defaults logfile="/var/log/sudo.log"'
    validate: "visudo -cf %s"
    mode: "0660"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.2.3
    - scored
  when: debian12cis_rules_5_2_3
# 5.2.4 Ensure SSH Protocol is not set to 1
# SSH v1 suffers from insecurities that do not affect SSH v2.
- name: 5.2.4 Ensure SSH Protocol is not set to 1
  debug:
    msg: This command not longer exists in newer versions of SSH.
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.2.4
    - scored
  when: debian12cis_rules_5_2_4
# 5.2.6 Ensure SSH X11 forwarding is disabled
# Disable X11 forwarding unless there is an operational requirement to use X11 applications
# directly. There is a small risk that the remote X11 servers of users who are logged in via
# SSH with X11 forwarding could be compromised by other users on the X11 server. Note
# that even if X11 forwarding is disabled, users can always install their own forwarders.
- name: 5.2.6 Ensure SSH X11 forwarding is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^X11Forwarding"
    line: "X11Forwarding no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.2.6
    - scored
  when: debian12cis_rules_5_2_6
# 5.2.18 Ensure SSH access is limited
# Restricting which users can remotely access the system via SSH will help ensure that only
# authorized users access the system.
- name: 5.2.18 Ensure SSH access is limited
  block:
    - name: 5.2.18 Ensure SSH access is limited - allow users
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^AllowUsers"
        line: "AllowUsers {{ allowed_users }}"
      when:
        - allowed_users != "None"
    - name: 5.2.18 Ensure SSH access is limited - allow groups
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^AllowGroups"
        line: "AllowGroups {{ allowed_groups }}"
      when:
        - allowed_groups != "None"
    - name: 5.2.18 Ensure SSH access is limited - denyusers
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^DenyUsers"
        line: "DenyUsers {{ deny_users }}"
      when:
        - deny_users != "None"
    - name: 5.2.18 Ensure SSH access is limited - denygroups
      lineinfile:
        state: present
        dest: /etc/ssh/sshd_config
        regexp: "^DenyGroups"
        line: "DenyGroups {{ deny_groups }}"
      when:
        - deny_groups != "None"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.2.18
    - scored
  when: debian12cis_rules_5_2_18
# 5.2.21 Ensure SSH AllowTcpForwarding is disabled
# Leaving port forwarding enabled can expose the organization to security risks and back-
# doors.
- name: 5.2.21 Ensure SSH AllowTcpForwarding is disabled
  lineinfile:
    state: present
    dest: /etc/ssh/sshd_config
    regexp: "^(#)?AllowTcpForwarding"
    line: "AllowTcpForwarding no"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.2.21
    - scored
  when: debian12cis_rules_5_2_21
# 5.3 Configure PAM
# 5.3.1 Ensure password creation requirements are configured
# Strong passwords protect systems from being hacked through brute force methods.
- name: 5.3.1 Ensure password creation requirements are configured
  block:
    - name: 5.3.1 Ensure password creation requirements are configured
      apt:
        name: libpam-pwquality
        state: present
        install_recommends: false
    - name: 5.3.1 Ensure password creation requirements are configured
      lineinfile:
        state: present
        create: yes
        dest: /etc/security/pwquality.conf
        regexp: "^{{ item.key }}"
        line: "{{ item.key }} = {{ item.value }}"
      with_items:
        - { key: "minlen", value: "14" }
        - { key: "dcredit", value: "-1" }
        - { key: "ucredit", value: "-1" }
        - { key: "ocredit", value: "-1" }
        - { key: "lcredit", value: "-1" }
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.3.1
    - scored
  when: debian12cis_rules_5_3_1
# 5.3.2 Ensure lockout for failed password attempts is configured
# Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force
# password attacks against your systems.
- name: 5.3.2 Ensure lockout for failed password attempts is configured
  vars:
    pam_module_name: "{{ 'pam_tally2.so' if ansible_distribution | lower == 'debian' and ansible_distribution_major_version is version('11', '<') else 'pam_faillock.so' }}"
  block:
    - name: 5.3.2 Ensure lockout for failed password attempts is configured - common-auth
      lineinfile:
        dest: /etc/pam.d/common-auth
        line: "auth required {{ pam_module_name }} onerr=fail audit silent deny=5 unlock_time=900"
        state: present
        create: true

    - name: 5.3.2 Ensure lockout for failed password attempts is configured - pam_deny.so
      lineinfile:
        dest: /etc/pam.d/common-account
        regexp: '^account\srequisite'
        line: "account requisite pam_deny.so"
        state: present
        create: true

    - name: 5.3.2 Ensure lockout for failed password attempts is configured
      lineinfile:
        dest: /etc/pam.d/common-account
        regexp: '^account\srequired'
        line: "account required {{ pam_module_name }}"
        state: present
        create: true

  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.3.2
    - scored
  when: debian12cis_rules_5_3_2
# 5.3.3 Ensure password reuse is limited
# The /etc/security/opasswd file stores the users' old passwords and can be checked to
# ensure that users are not recycling recent passwords.
- name: 5.3.3 Ensure password reuse is limited
  lineinfile:
    dest: /etc/pam.d/common-password
    line: "password required pam_pwhistory.so remember=5"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.3.3
    - scored
  when: debian12cis_rules_5_3_3
# 5.3.4 Ensure password hashing algorithm is SHA-512
# The SHA-512 algorithm provides much stronger hashing than MD5, thus providing
# additional protection to the system by increasing the level of effort for an attacker to
# successfully determine passwords.
- name: 5.3.4 Ensure password hashing algorithm is SHA-512
  replace:
    path: /etc/pam.d/common-password
    regexp: '(\bmd5\b|\bsha1\b|\bsha256\b|\bsha384\b)'
    replace: 'sha512'
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.3.4
    - scored
  when: debian12cis_rules_5_3_4
# 5.4 User Accounts and Environment
# 5.4.1 Set Shadow Password Suite Parameters
# 5.4.1.1 Ensure password expiration is 365 days or less
# 5.4.1.2 Ensure minimum days between password changes is configured
# 5.4.1.3 Ensure password expiration warning days is 7 or more
- name: 5.4.1 Set Shadow Password Suite Parameters
  block:
    - name: 5.4.1.1 Ensure password expiration is 365 days or less - PASS_MAX_DAYS
      lineinfile:
        state: present
        dest: /etc/login.defs
        regexp: "^PASS_MAX_DAYS"
        line: "PASS_MAX_DAYS {{ pass_expire_in_days | default(9999999) }}"
      when: debian12cis_rules_5_4_1_1
    - name: 5.4.1.2 Ensure minimum days between password changes is configured - PASS_MIN_DAYS
      lineinfile:
        state: present
        dest: /etc/login.defs
        regexp: "^PASS_MIN_DAYS"
        line: "PASS_MIN_DAYS {{ pass_min_days | default(7) }}"
      when: debian12cis_rules_5_4_1_2
    - name: 5.4.1.3 Ensure password expiration warning days is 7 or more - PASS_WARN_AGE
      lineinfile:
        state: present
        dest: /etc/login.defs
        regexp: "^PASS_WARN_AGE"
        line: "PASS_WARN_AGE {{ pass_warn_age | default(7) }}"
      when: debian12cis_rules_5_4_1_3
    - name: 5.4.1.1 Ensure password expiration is 365 days or less - chage
      command: "chage --maxdays {{ pass_expire_in_days | default(9999999) }} {{ item }}"
      with_items: "{{ list_of_os_users }}"
      when: debian12cis_rules_5_4_1_1
    - name: 5.4.1.2 Ensure minimum days between password changes is configured - chage
      command: "chage --mindays {{ pass_min_days | default(7) }} {{ item }}"
      with_items: "{{ list_of_os_users }}"
      when: debian12cis_rules_5_4_1_2
    - name: 5.4.1.3 Ensure password expiration warning days is 7 or more - chage
      command: "chage --warndays {{ pass_warn_age | default(7) }} {{ item }}"
      with_items: "{{ list_of_os_users }}"
      when: debian12cis_rules_5_4_1_3
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.1.1
    - 5.4.1.2
    - 5.4.1.3
    - scored
  when: debian12cis_rules_5_4_1 and
        (debian12cis_rules_5_4_1_1 or
         debian12cis_rules_5_4_1_2 or
         debian12cis_rules_5_4_1_3)
# 5.4.1.4 Ensure inactive password lock is 30 days or less
# Inactive accounts pose a threat to system security since the users are not logging in to
# notice failed login attempts or other anomalies.
- name: 5.4.1.4 Ensure inactive password lock is 30 days or less
  block:
    - name: 5.4.1.4 Ensure inactive password lock is 30 days or less - useradd
      command: "useradd -D -f {{ account_inactive }}"
    - name: 5.4.1.4 Ensure inactive password lock is 30 days or less - change
      command: "chage --inactive {{ account_inactive }} {{ item }}"
      with_items: "{{ list_of_os_users }}"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.1.4
    - scored
  when: debian12cis_rules_5_4_1 and
        debian12cis_rules_5_4_1_4
# 5.4.1.5 Ensure all users last password change date is in the past
# If a users recorded password change date is in the future then they could bypass any set
# password expiration.
- name: 5.4.1.5 Ensure all users last password change date is in the past
  block:
    - name: 5.4.1.5 Ensure all users last password change date is in the past - get list
      shell: |
        awk -F: '{print $1}' /etc/shadow | while read -r user
        do
          if [[ $(date --date="$(chage --list "$user" | grep '^Last password change' | cut -d: -f2)" +%s) > $(date +%s) ]];then
            echo "$user"
          fi
        done
      register: output_5_4_1_5
      changed_when: output_5_4_1_5.stdout_lines | length > 0
      check_mode: no
    - name: 5.4.1.5 Ensure all users last password change date is in the past - print list
      debug:
        msg: "{{ output_5_4_1_5.stdout_lines }}"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.1.5
    - manual_setup
    - scored
  when: debian12cis_rules_5_4_1 and
        debian12cis_rules_5_4_1_5
# 5.4.2 Ensure system accounts are secured
# It is important to make sure that accounts that are not being used by regular users are
# prevented from being used to provide an interactive shell. By default, most distributions
# set the password field for these accounts to an invalid string, but it is also recommended
# that the shell field in the password file be set to the nologin shell. This prevents the
# account from potentially being used to run any commands.
- name: 5.4.2 Ensure system accounts are secured
  block:
    - name: 5.4.2 Ensure system accounts are secured - set all system accounts to a non login shell
      shell: |
        for user in `awk -F: '($3 < 1000) {print $1 }' /etc/passwd`; do
        if [ $user != "root" ]; then
          usermod -L $user
          if [ $user != "sync" ] && [ $user != "shutdown" ] && [ $user != "halt" ] && [ $user != "rundeck" ];
          then
            usermod -s /usr/sbin/nologin $user
          fi
        fi
        done
      register: output_5_4_2
      changed_when: output_5_4_2.stderr == ""
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.2
    - scored
  when: debian12cis_rules_5_4_2
# 5.4.3 Ensure default group for the root account is GID 0
# Using GID 0 for the root account helps prevent root -owned files from accidentally
# becoming accessible to non-privileged users.
- name: 5.4.3 Ensure default group for the root account is GID 0
  command: usermod -g 0 root
  register: output_5_4_3
  changed_when: |
    output_5_4_3.stderr is not search("usermod: no changes")
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.3
    - scored
  when: debian12cis_rules_5_4_3
# 5.4.4 Ensure default user umask is 027 or more restrictive
# Setting a very secure default value for umask ensures that users make a conscious choice
# about their file permissions. A default umask setting of 077 causes files and directories
# created by users to not be readable by any other user on the system. A umask of 027 would
# make files and directories readable by users in the same Unix group, while a umask of 022
# would make files readable by every user on the system.
- name: 5.4.4 Ensure default user umask is 027 or more restrictive
  block:
    - name: 5.4.4 Ensure default user umask is 027 or more restrictive - /etc/bash.bashrc
      lineinfile:
        state: present
        dest: /etc/bash.bashrc
        create: true
        regexp: "^umask "
        line: "umask 027"
    - name: 5.4.4 Ensure default user umask is 027 or more restrictive - /etc/profile
      lineinfile:
        state: present
        dest: /etc/profile
        create: true
        regexp: "^umask "
        line: "umask 027"
    - name: 5.4.4 Ensure default user umask is 027 or more restrictive - /etc/profile.d/umask.sh
      lineinfile:
        state: present
        dest: /etc/profile.d/umask.sh
        create: true
        regexp: "^umask "
        line: "umask 027"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.4
    - scored
  when: debian12cis_rules_5_4_4
# 5.4.5 Ensure default user shell timeout is 900 seconds or less
# Having no timeout value associated with a shell could allow an unauthorized user access to
# another user's shell session (e.g. user walks away from their computer and doesn't lock the
# screen). Setting a timeout value at least reduces the risk of this happening.
- name: 5.4.5 Ensure default user shell timeout is 900 seconds or less
  block:
    - name: 5.4.5 Ensure default user shell timeout is 900 seconds or less - /etc/bash.bashrc
      lineinfile:
        state: present
        dest: /etc/bash.bashrc
        create: true
        regexp: "^TMOUT="
        line: "readonly TMOUT={{ shell_timeout_sec }} ; export TMOUT"
    - name: 5.4.5 Ensure default user shell timeout is 900 seconds or less - /etc/profile
      lineinfile:
        state: present
        dest: /etc/profile
        create: true
        regexp: "^TMOUT="
        line: "readonly TMOUT={{ shell_timeout_sec }} ; export TMOUT"
    - name: 5.4.5 Ensure default user shell timeout is 900 seconds or less - /etc/profile.d/timeout.sh
      lineinfile:
        state: present
        dest: /etc/profile.d/tmout.sh
        create: true
        regexp: "^TMOUT="
        line: "readonly TMOUT={{ shell_timeout_sec }} ; export TMOUT"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - 5.4.5
    - scored
  when: debian12cis_rules_5_4_5
# 5.5 Ensure root login is restricted to system console
# Since the system console has special properties to handle emergency situations, it is important to
# ensure that the console is in a physically secure location and that unauthorized consoles have not been defined.
- name: 5.5 Ensure root login is restricted to system console
  block:
    - name: 5.5 Ensure root login is restricted to system console - check file
      stat:
        path: /etc/securetty
      register: output_5_5
    - name: 5.5 Ensure root login is restricted to system console - print output
      debug:
        msg: "{{ output_5_5 }}"
  ignore_errors: true
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - "5.5"
    - manual_setup
    - not-scored
  when: debian12cis_rules_5_5
# 5.6 Ensure access to the su command is restricted
# Restricting the use of su , and using sudo in its place, provides system administrators better
# control of the escalation of user privileges to execute privileged commands. The sudo utility
# also provides a better logging and audit mechanism, as it can log each command executed
# via sudo, whereas su can only record that a user executed the su program.
- name: 5.6 Ensure access to the su command is restricted
  block:
    - name: 5.6 Ensure access to the su command is restricted -groupadd
      group:
        name: sugroup
        state: present
    - name: 5.6 Ensure access to the su command is restricted - change
      lineinfile:
        state: present
        dest: /etc/pam.d/su
        regexp: '^(#)?auth\s+required\s+pam_wheel\.so'
        line: "auth required pam_wheel.so use_uid group=sugroup"
  tags:
    - section5
    - level_1_server
    - level_1_workstation
    - "5.6"
    - scored
  when: debian12cis_rules_5_6
